<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ponto FTVTEC</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; media-src 'self' blob:; connect-src https://anotrdjomxzgyqvvdzbe.supabase.co wss://anotrdjomxzgyqvvdzbe.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A1628">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Ponto TVTEC">
<meta name="application-name" content="Ponto TVTEC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: login dividido (painel escuro + formulário); app do colaborador mobile-first com abas; painel RH com barra lateral que vira abas no celular */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0D1A2B; --muted:#5A6B82; --line:#D8E0E9;
  --accent:#0A7B84; --accent-ink:#FFFFFF; --accent-soft:#DCF1F1; --glow:#17C9B6;
  --deep:#0A1628; --deep-2:#12223A; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#223552;
  --ok:#157F51; --ok-bg:#E0F2E8; --warn:#9A6600; --warn-bg:#FBEFD5; --bad:#B9362C; --bad-bg:#FAE3E0; --info:#2C5BC4; --info-bg:#E3EAFA;
  --shadow:0 1px 2px rgba(13,26,43,.06),0 8px 24px rgba(13,26,43,.06);
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111E; --surface:#0F1B2D; --surface-2:#132238; --ink:#E5EDF6; --muted:#8C9FB8; --line:#22334B;
  --accent:#2CC4B4; --accent-ink:#04201D; --accent-soft:#103534; --glow:#3FE0CC;
  --deep:#0B1626; --deep-2:#122139; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#25395A;
  --ok:#4CC88C; --ok-bg:#12321F; --warn:#E3B04B; --warn-bg:#3A2C0C; --bad:#F07A6E; --bad-bg:#3E1714; --info:#7FA4F5; --info-bg:#172A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111E; --surface:#0F1B2D; --surface-2:#132238; --ink:#E5EDF6; --muted:#8C9FB8; --line:#22334B;
  --accent:#2CC4B4; --accent-ink:#04201D; --accent-soft:#103534; --glow:#3FE0CC;
  --deep:#0B1626; --deep-2:#122139; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#25395A;
  --ok:#4CC88C; --ok-bg:#12321F; --warn:#E3B04B; --warn-bg:#3A2C0C; --bad:#F07A6E; --bad-bg:#3E1714; --info:#7FA4F5; --info-bg:#172A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:6px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.plain::before{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pos{color:var(--ok)}.neg{color:var(--bad)}
tr.weekend td{color:var(--muted);background:color-mix(in srgb,var(--surface-2) 60%,transparent)}

/* Brand mark */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--glow),#2C6BD8);color:#04121F;flex:none}
.mark svg{width:18px;height:18px}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-hero{background:var(--deep);color:var(--deep-ink);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px}
.login-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:44px 44px;opacity:.45;mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.login-hero>*{position:relative}
.hero-clock{font-family:var(--f-mono);font-size:clamp(3rem,7vw,5.4rem);font-weight:500;letter-spacing:-.04em;line-height:1;color:#fff}
.hero-clock .sec{color:var(--glow)}
.hero-date{color:var(--deep-muted);margin-top:10px;font-size:1rem;text-transform:capitalize}
.hero-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:560px}
.hero-feat{border-top:1px solid var(--deep-line);padding-top:12px}
.hero-feat b{display:block;font-family:var(--f-display);font-size:.92rem;color:#fff;margin-bottom:2px}
.hero-feat span{font-size:.82rem;color:var(--deep-muted)}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.demo-box{border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.demo-list{display:flex;flex-wrap:wrap;gap:6px}
.demo-list button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;color:var(--ink)}
.demo-list button:hover{border-color:var(--accent)}
.err{color:var(--bad);font-size:.85rem}

/* ---------- COLABORADOR ---------- */
.emp{max-width:760px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:.85rem;background:var(--accent-soft);color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.clockcard{background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.clockcard::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 28%,transparent),transparent 70%)}
.clockcard>*{position:relative;z-index:1}
.big-clock{font-family:var(--f-mono);font-size:clamp(2.8rem,12vw,4.2rem);line-height:1;font-weight:500;letter-spacing:-.04em;color:#fff}
.big-clock .sec{color:var(--glow);font-size:.55em}
.cc-meta{display:flex;gap:8px;flex-wrap:wrap}
.cc-meta .chip{background:var(--deep-2);color:var(--deep-ink);border-color:var(--deep-line)}
.punch-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border-radius:12px;border:0;background:var(--glow);color:#04201D;font-family:var(--f-display);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 30px color-mix(in srgb,var(--glow) 35%,transparent)}
.punch-btn:hover{filter:brightness(1.05)}
.punch-btn svg{width:24px;height:24px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .t{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.slot .e{font-size:.72rem;color:var(--muted)}
.slot.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.slot.done .t{color:var(--accent)}
.slot.next{border-style:dashed;border-color:var(--accent)}
.slot.vazio .t{color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:500}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:760px}
.tabbar button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:.82rem;color:var(--muted)}

/* ---------- RH ---------- */
.rh{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--deep);color:var(--deep-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .brand{color:#fff;padding:0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--deep-muted);padding:9px 10px;border-radius:8px;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:#fff;background:var(--deep-2)}
.nav button.on{color:#fff;background:var(--deep-2);box-shadow:inset 3px 0 0 var(--glow)}
.nav .badge{margin-left:auto;background:var(--glow);color:#04201D;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--deep-muted);display:flex;flex-direction:column;gap:10px;padding:0 6px}
.side-foot .btn{background:transparent;color:var(--deep-ink);border-color:var(--deep-line)}
.main{min-width:0;padding-block:24px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h .spacer{min-width:10px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols>*{min-width:0}
.now-status{display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right}
.alert-i{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.alert-i:last-child{border-bottom:0}
.alert-i .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.req{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.req:last-child{border-bottom:0}
.req .grow{flex:1;min-width:220px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.search{max-width:260px}

/* ---------- MODAL / CAPTURA ---------- */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(5,12,22,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1;margin-left:auto;padding:4px 8px}
.capture{background:var(--deep);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--deep-ink)}
.viewport{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.viewport .cam{position:absolute;inset:14px;border-radius:50%;overflow:hidden;background:#050B14;display:grid;place-items:center}
.viewport video,.viewport img.snap{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.viewport img.snap{transform:none}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,var(--glow) 100%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);animation:spin 2.4s linear infinite}
.ring.idle{animation-duration:6s;opacity:.6}
.ring.ok{background:var(--ok);animation:none}
.ring.bad{background:var(--bad);animation:none}
.ticks{position:absolute;inset:0}
.scanline{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);top:20%;animation:scan 1.8s ease-in-out infinite alternate;border-radius:2px;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{to{top:78%}}
.cam-ph{color:var(--deep-muted);font-size:.85rem;text-align:center;padding:20px}
.steps{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px}
.step{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--deep-muted)}
.step i{width:16px;height:16px;border-radius:50%;border:2px solid var(--deep-line);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px}
.step.run{color:#fff}.step.run i{border-color:var(--glow);border-top-color:transparent;animation:spin .8s linear infinite}
.step.ok{color:#fff}.step.ok i{background:var(--glow);border-color:var(--glow);color:#04201D}
.step.fail{color:#fff}.step.fail i{background:var(--bad);border-color:var(--bad);color:#fff}
.receipt{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-family:var(--f-mono);font-size:.8rem;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-1px;height:4px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 14px)}
.receipt .rl{display:flex;justify-content:space-between;gap:12px}
.receipt .rl span:first-child{color:var(--muted)}
.receipt .rl span:last-child{text-align:right;word-break:break-all}
.receipt .big{font-size:1.7rem;font-weight:500;text-align:center;color:var(--ink);padding:6px 0}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.hash{word-break:break-all;color:var(--muted);font-size:.72rem}
.notice{font-size:.8rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:900px){
  .login{grid-template-columns:1fr}

.geo-end svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:2px}
.geo-meta{font-size:.75rem;color:var(--muted)}
.geo-b .btn{margin-top:4px;text-decoration:none}
.ext-pin{display:inline-grid;place-items:center;width:20px;height:20px;padding:0;margin-left:2px;border:0;border-radius:50%;background:var(--warn-bg);color:var(--warn);cursor:pointer;vertical-align:middle}
.ext-pin svg{width:12px;height:12px}
.receipt [data-end]{word-break:normal;overflow-wrap:anywhere;text-align:right;font-family:var(--f-body)}
.kpi-btn{font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.kpi-btn:hover,.kpi-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent);outline:none;transform:translateY(-1px)}
.kpi-more{font-size:.75rem;color:var(--accent);margin-top:2px}
.kpi-li{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);font:inherit;color:inherit;cursor:pointer}
.kpi-li:hover{background:var(--surface-2)}
.opt-card{display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:10px}
.opt-card span{font-size:.86rem;color:var(--muted)}
.opt-card .btn{align-self:flex-start;margin-top:4px}
.just-marc{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg);margin-bottom:12px}
.jm-h{display:flex;gap:10px;align-items:flex-start}
.jm-h svg{flex:none;width:20px;height:20px;color:var(--warn);margin-top:2px}
.jm-h div{display:flex;flex-direction:column;gap:2px}
.jm-h span{font-size:.85rem;color:var(--ink)}
.just-marc .btn{align-self:flex-start}
.rev-just{display:flex;flex-direction:column;gap:2px;margin-top:8px;padding:10px 12px;border-radius:10px;border-left:3px solid var(--accent);background:var(--accent-soft);font-size:.88rem}
.rev-just b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rev-just.vazio{border-left-color:var(--warn);background:var(--warn-bg)}
.rev-just.vazio b{color:var(--warn)}
.req.rev{align-items:flex-start}
.extra-card{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.extra-card .timeline{padding:12px 16px 0}
/* avisos */
.bell-btn{position:relative}
.bell-n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;line-height:1}
.notif-li{width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;font:inherit;color:inherit;align-items:flex-start}
.notif-li .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:transparent}
.notif-li.nova .dot{background:var(--accent)}
.notif-li.nova .ttl{font-weight:700}
/* faltas abonadas */
.ab-grid{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:18px;align-items:center}
.ab-big{display:flex;flex-direction:column;align-items:flex-start;padding-right:18px;border-right:1px solid var(--line)}
.ab-big .v{font-size:2.4rem;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ab-big .l{font-size:.78rem;color:var(--muted);margin-top:4px}
.ab-sem{display:flex;flex-direction:column;gap:10px;min-width:0}
.ab-sem>div{display:grid;grid-template-columns:96px auto 1fr;gap:10px;align-items:center}
.ab-sem .l{font-size:.8rem;color:var(--muted)}
.ab-sem .n{font-size:.8rem;text-align:right;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px}
.pip{width:22px;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.pip.on{background:var(--accent);border-color:var(--accent)}
.ab-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ab-mini>div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px}
.ab-mini b{font-size:1.4rem;color:var(--accent);font-variant-numeric:tabular-nums}
.ab-mini span{font-size:.75rem;color:var(--muted)}
@media (max-width:520px){.ab-grid{grid-template-columns:minmax(0,1fr)}.ab-big{border-right:0;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:12px}.ab-sem>div{grid-template-columns:80px auto 1fr}}
@media (max-width:480px){.emp .bell-btn>span:not(.bell-n){display:none}}
.nav-sep{height:1px;background:var(--deep-line);margin:8px 10px}
.nav .badge.alerta{background:var(--bad);color:#fff}
.nav-avisos.tem svg{color:var(--glow)}
.m-bell{display:none}
@media (max-width:900px){
  .m-bell{display:inline-flex;order:1;position:relative;align-items:center;justify-content:center;width:40px;height:38px;border:1px solid var(--deep-line);background:var(--deep-2);color:#fff;border-radius:8px;cursor:pointer;padding:0}
  .m-bell svg{width:18px;height:18px}
  .m-bell-n{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;line-height:1}
  .side .nav .nav-sep{margin:6px 4px}
}
.g-obs textarea{min-height:60px}
.g-obs-v{border-left-color:var(--info);background:var(--info-bg)}
.g-obs-v b{color:var(--info)}
.g-obs-box{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:12px}
.rev-acts{flex-wrap:wrap;justify-content:flex-end}
.reset-o{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;font-size:.85rem}
.reset-o>div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.reset-o ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.check-row{display:flex;gap:8px;align-items:flex-start;font-size:.88rem}
.check-row input{margin-top:3px}
.btn.warn-btn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
@media (max-width:520px){.reset-o{grid-template-columns:1fr}}
.ab-rh-info{font-size:.8rem;margin:4px 0 8px}

.hol-li{flex-wrap:wrap;gap:12px}
.ico-pdf{flex:none;width:40px;height:40px;border-radius:10px;background:color-mix(in srgb,var(--accent) 14%,var(--surface-2));color:var(--accent);display:grid;place-items:center;font-size:.68rem;font-weight:700;letter-spacing:.04em}
.hol-acts{flex-wrap:wrap;gap:8px;margin-left:auto}
@media (max-width:560px){.hol-acts{width:100%;margin-left:0}.hol-acts .btn{flex:1}}

.hol-pv{display:flex;flex-direction:column;gap:12px;align-items:center;max-height:68vh;overflow:auto;background:var(--surface-2);border-radius:10px;padding:8px}
.hol-pv canvas{background:#fff;border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.18)}

async function fetchPunches(fromDate,toDate){
  let out=[];
  for(const modo of ['revisadas','normais']){
    for(let from=0;;from+=1000){
      let q=sb.from('marcacoes').select(PCOLS).gte('ts',fromDate.toISOString());
      if(toDate)q=q.lt('ts',toDate.toISOString());
      q=modo==='revisadas'?q.neq('revisao','desconsiderada'):q.is('revisao',null);
      const r=await q.order('ts').range(from,from+999);if(r.error)throw r.error;
      out=out.concat(r.data);if(r.data.length<1000)break;
    }
  }

}

/* ================= CÁLCULO ================= */
function dayInfo(e,ds){
  const j=jor(e.jornadaId),d=parseD(ds),dow=d.getDay(),hol=holOf(ds),td=today();
  const marks=marksOf(e.id,ds);
  const sched=j.dias.includes(dow)&&!hol;
  const exp=sched?expMin(j):0;
  const just=S.requests.find(r=>r.empId===e.id&&r.status==='aprovado'&&r.tipo!=='ajuste'&&ds>=r.data&&ds<=(r.ate||r.data));
  let worked=0,open=false;
  for(let i=0;i<marks.length;i+=2){const a=tsMin(marks[i].ts);if(marks[i+1])worked+=tsMin(marks[i+1].ts)-a;else if(ds===td){worked+=Math.max(0,nowMin()-a);open=true}}
  const incomplete=marks.length%2===1&&ds<td;
  let credit=worked;if(just&&sched)credit=Math.max(worked,exp);
  let saldo=credit-exp;if(Math.abs(saldo)<=j.tol&&sched)saldo=0;
  // Jornada flexível: entrar mais tarde não é atraso se a carga horária do dia for cumprida
  const late=sched&&marks[0]?tsMin(marks[0].ts)-toMin(j.ini):0;
  const fechado=ds<td||(marks.length>=4&&!open&&!incomplete);
  const atraso=late>5&&!(fechado&&credit>=exp-j.tol)&&!(ds===td&&!fechado)?late:0;
  let status;
  if(ds>td)status='futuro';
  else if(hol)status=marks.length?'extra':'feriado';
  else if(!j.dias.includes(dow))status=marks.length?'extra':'folga';
  else if(just)status=just.tipo==='ferias'?'ferias':just.tipo==='abonada'?'abonada':'abonado';
  else if(!marks.length)status=ds<td?'falta':(nowMin()>toMin(j.ini)+30?'ausente':'aguardando');
  else if(incomplete)status='incompleto';
  else if(atraso)status='atraso';
  else if(ds<td&&saldo>0)status='extra';
  else status='ok';
  const final=ds<td||(marks.length>=4&&!open);
  return{ds,dow,hol,marks,sched,exp,worked,credit,saldo:final&&status!=='falta'?saldo:(status==='falta'?-exp:null),atraso,status,open,just,j};
}
const ST={ok:['Regular','ok'],atraso:['Atraso','warn'],falta:['Falta','bad'],incompleto:['Incompleto','warn'],abonado:['Abonado','info'],abonada:['Falta abonada','info'],ferias:['Férias','info'],feriado:['Feriado','plain'],folga:['Folga','plain'],extra:['Hora extra','acc'],ausente:['Ausente','bad'],aguardando:['Aguardando','plain'],futuro:['·','plain'],pre:['Fora do período','plain']};

function anomDe(di){if(di.ds>=today()||di.status==='futuro'||di.status==='pre'||di.ds<(S.config.inicioPonto||'0000'))return null;if(['falta','atraso','incompleto'].includes(di.status))return di.status;if(di.sched&&di.marks.length&&di.saldo!=null&&di.saldo<0&&di.status==='ok')return 'saida';return null}
const relatoDe=(e,ds)=>S.requests.find(r=>r.empId===e.id&&r.status!=='recusado'&&ds>=r.data&&ds<=(r.ate||r.data));
function fechamentoDe(ym){const[y,m]=ym.split('-').map(Number);const dia=Math.min(28,Math.max(1,S.config.diaFech||5));return `${m===12?y+1:y}-${pad(m===12?1:m+1)}-${pad(dia)}`}
const mesFechado=(e,ym)=>{const a=aprovDe(e.id,ym);return today()>fechamentoDe(ym)||!!(a&&a.status==='aprovado')};
function mesesAbertos(){const d=NOW();const p=new Date(d.getFullYear(),d.getMonth()-1,1);return [`${p.getFullYear()}-${pad(p.getMonth()+1)}`,today().slice(0,7)]}

    <div class="pend-list">${itens}</div>${compacto&&pend.length>3?`<button class="btn sm ghost" data-act="etab" data-v="espelho">Ver as ${pend.length} na folha de ponto</button>`:''}</section>`;
}
function monthDays(ym){const[y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${ym}-${pad(i+1)}`)}
function monthSummary(e,ym){
  const td=today();let worked=0,exp=0,saldo=0,extra=0,atrasos=0,faltas=0,days=[];
  const ini=S.config.inicioPonto||'0000';const adm=(e.admissao||'0000')>ini?(e.admissao||'0000'):ini;
  monthDays(ym).forEach(ds=>{const di=dayInfo(e,ds);if(ds<adm){di.pre=true;di.status=ds>td?'futuro':(di.hol?'feriado':!di.j.dias.includes(di.dow)?'folga':'pre');di.saldo=null;di.credit=0;di.exp=0;di.atraso=0}days.push(di);if(ds>td||ds<adm)return;worked+=di.credit;if(ds<td||di.saldo!=null)exp+=di.exp;if(di.saldo!=null){saldo+=di.saldo;if(di.saldo>0)extra+=di.saldo}if(di.atraso&&!['abonado','abonada','ferias'].includes(di.status))atrasos++;if(di.status==='falta')faltas++});
  return{days,worked,exp,saldo,extra,atrasos,faltas};
}
function nowState(e){
  const di=dayInfo(e,today()),n=di.marks.length;
  if(n===0){if(di.hol)return['Feriado','plain',''];if(!di.j.dias.includes(di.dow))return['Folga','plain',''];if(di.just)return[di.just.tipo==='ferias'?'Férias':'Abonado','info',''];return di.status==='ausente'?['Não registrou','bad',`Entrada prevista ${di.j.ini}`]:['Aguardando','plain',`Entrada prevista ${di.j.ini}`]}
  const last=di.marks[n-1].ts.slice(11,16);
  if(n%2===1)return['Trabalhando','ok',`desde ${last}`];
  if(n===2)return['Em intervalo','warn',`desde ${last}`];
  return['Encerrou','info',`às ${last}`];
}

async function startMfaEnroll(){

function monthOpts(sel){const d=NOW();let o='';for(let i=0;i<6;i++){const x=new Date(d.getFullYear(),d.getMonth()-i,1);const v=`${x.getFullYear()}-${pad(x.getMonth()+1)}`;o+=`<option value="${v}" ${v===sel?'selected':''}>${MES[x.getMonth()]} de ${x.getFullYear()}</option>`}return o}
function checkSig(e,ym){

function aprovBlock(e,ym,ms){

  const quem=a?((a.resumo&&a.resumo.por)||(emp(a.aprovado_por)||{nome:'Gestor'}).nome):'';

  else corpo=`<div><div style="font-weight:600;color:var(--bad)">Devolvido para ajuste</div><div class="muted" style="font-size:.85rem">Por ${esc(quem)} em ${fmtDate(quando.slice(0,10))} às ${quando.slice(11,16)}</div><div style="font-size:.85rem;margin-top:2px">${esc(a.observacao||'')}</div></div>`;

function addScript([src,sri]){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.integrity=sri;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.onload=ok;s.onerror=()=>ko(new Error('Não foi possível carregar a biblioteca de leitura. Verifique a conexão.'));document.head.appendChild(s)})}
let _leitor=null;
function carregaLeitor(){

    await addScript(LIBS_HOL.worker);window.pdfjsLib.GlobalWorkerOptions.workerSrc=LIBS_HOL.worker[0]})().catch(e=>{_leitor=null;throw e});

}
const normNome=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim();

const RE_NUM=/^-?\d{1,3}(?:\.\d{3})*,\d{2}$|^-?\d+,\d{2}$/;

// lê uma página do PDF da folha: usa o texto e a posição de cada item na página
function lerPagina(items){
  const it=items.filter(i=>i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5],w:i.width}));
  const tits=it.filter(i=>/^DEMONSTRATIVO DE PAGAMENTO/.test(i.s)).sort((a,b)=>b.y-a.y);
  if(!tits.length)return null;
  const topo=tits[0].y,base=tits[1]?tits[1].y:-1e9;       // só o primeiro bloco: o PDF repete a via do funcionário
  const B=it.filter(i=>i.y<=topo+2&&i.y>base+2&&i.x<540);
  const linha=y=>B.filter(i=>Math.abs(i.y-y)<=1.5).sort((a,b)=>a.x-b.x);
  const achar=re=>B.find(i=>re.test(i.s));
  const hRef=B.find(i=>/^Refer[êe]ncia:\s*\d{2}\/\d{4}/.test(i.s)),hCod=B.filter(i=>/^C[óo]digo$/.test(i.s)).sort((a,b)=>b.y-a.y)[0],hNome=achar(/^Nome do Funcion/);
  if(!hRef||!hCod||!hNome)return null;
  const m=hRef.s.match(/(\d{2})\/(\d{4})/);
  const ln=B.filter(i=>i.y<hCod.y-4&&i.y>hCod.y-14).sort((a,b)=>a.x-b.x);
  const cod=(ln.find(i=>/^\d+$/.test(i.s)&&i.x<hNome.x)||{}).s,nome=(ln.find(i=>Math.abs(i.x-hNome.x)<4)||{}).s;
  if(!cod||!nome)return null;
  const cbo=(ln.find(i=>/^\d{3,4}-\d{2}$/.test(i.s))||{}).s||'';
  const yEmp=B.filter(i=>i.y<tits[0].y-6&&i.y>tits[0].y-16).sort((a,b)=>a.x-b.x);
  const empresa=(yEmp[0]||{}).s||'',endereco=((B.filter(i=>Math.abs(i.y-(tits[0].y-22))<=2.5)[0])||{}).s||'';
  const cnpj=(B.find(i=>/^\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}$/.test(i.s))||{}).s||'';
  const tcar=B.find(i=>/^Cargo:/.test(i.s));
  const mc=tcar?tcar.s.match(/^Cargo:\s*(.*?)\s*Fun[çc][ãa]o:\s*(.*)$/):null;
  const adm=(B.find(i=>/^Admiss[ãa]o:/.test(i.s))||{s:''}).s.replace(/^.*?:\s*/,''),nasc=(B.find(i=>/^Nascimento:/.test(i.s))||{s:''}).s.replace(/^.*?:\s*/,'');
  const hv=B.filter(i=>/^(Refer[êe]ncia|Vencimentos|Descontos)$/.test(i.s)&&i.y<hCod.y-20);
  const cRef=hv.find(i=>/^Refer/.test(i.s)),cV=hv.find(i=>/^Venc/.test(i.s)),cD=hv.find(i=>/^Desc/.test(i.s));
  const tot=B.find(i=>/^Total de Vencimentos/.test(i.s));
  if(!cV||!cD||!tot)return null;
  const centro=i=>i.x+i.w/2,cen={ref:cRef?centro(cRef):1e9,v:centro(cV),d:centro(cD)};
  const lanc=[];
  const yIni=cV.y-3,cand=B.filter(i=>i.y<yIni&&i.y>tot.y+4).sort((a,b)=>b.y-a.y),grupos=[];
  cand.forEach(i=>{const g=grupos[grupos.length-1];if(g&&Math.abs(g.y-i.y)<=3)g.it.push(i);else grupos.push({y:i.y,it:[i]})});
  grupos.forEach(G=>{
    const L=G.it.sort((a,b)=>a.x-b.x);
    const c=L.find(i=>/^\d+$/.test(i.s)&&i.x<68);if(!c)return;
    const desc=L.filter(i=>i.x>=68&&i.x<300&&!RE_NUM.test(i.s)).map(i=>i.s).join(' ');
    const o={cod:c.s,desc,ref:null,venc:null,descto:null};
    L.filter(i=>i.x>=300&&RE_NUM.test(i.s)).forEach(n=>{const cx=centro(n);const d=[['ref',Math.abs(cx-cen.ref)],['v',Math.abs(cx-cen.v)],['d',Math.abs(cx-cen.d)]].sort((a,b)=>a[1]-b[1])[0][0];
      if(d==='ref')o.ref=numBR(n.s);else if(d==='v')o.venc=numBR(n.s);else o.descto=numBR(n.s)});
    lanc.push(o);
  });
  const vl=B.find(i=>/^Valor L[íi]quido/.test(i.s));
  const dir=(y,xmin,xmax)=>B.filter(i=>Math.abs(i.y-y)<=2&&i.x>=xmin&&i.x<xmax&&RE_NUM.test(i.s)).map(i=>numBR(i.s))[0];
  const totV=B.filter(i=>Math.abs(i.y-(tot.y-10))<=2&&i.x<cV.x+60&&RE_NUM.test(i.s)).map(i=>numBR(i.s))[0];
  const totD=B.filter(i=>Math.abs(i.y-(tot.y-10))<=2&&i.x>=cD.x-10&&RE_NUM.test(i.s)).map(i=>numBR(i.s))[0];
  const liquido=vl?B.filter(i=>Math.abs(i.y-vl.y)<=2&&i.x>vl.x+vl.w&&RE_NUM.test(i.s)).map(i=>numBR(i.s))[0]:null;
  if(!lanc.length||liquido==null)return null;
  const labels=B.filter(i=>/^(Sal[áa]rio Base|Sal\. Contr\. INSS|Base Calc\. FGTS|FGTS do M[êe]s|Base Calc\. IRRF|Faixa IRRF)$/.test(i.s));
  const bases=[];labels.forEach(l=>{const v=B.filter(i=>Math.abs(i.y-(l.y-8))<=3&&RE_NUM.test(i.s)).sort((a,b)=>Math.abs(centro(a)-centro(l))-Math.abs(centro(b)-centro(l)))[0];bases.push({r:l.s,v:v?numBR(v.s):null})});
  const emissao=(B.find(i=>/^FX Sistemas/.test(i.s))||{s:''}).s;
  return {empresa,endereco,cnpj,ref:`${m[1]}/${m[2]}`,comp:`${m[2]}-${m[1]}`,titulo:tituloHol(tits[0].s.replace(/^DEMONSTRATIVO DE PAGAMENTO DE\s*/,'')),
    cod,nome,cbo,cargo:mc?mc[1]:'',funcao:mc?mc[2]:'',admissao:adm,nascimento:nasc,lancamentos:lanc,totVenc:totV,totDesc:totD,liquido,bases,emissao};
}
async function lerPDF(buf){
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise,out=[],falhas=[];
  for(let p=1;p<=doc.numPages;p++){const c=await (await doc.getPage(p)).getTextContent();const r=lerPagina(c.items);if(r)out.push(r);else falhas.push(p)}
  return {itens:out,falhas};
}
async function analisarArquivos(files){
  await carregaLeitor();
  const pdfs=[],falhas=[];
  for(const f of files){
    if(/\.zip$/i.test(f.name)||f.type==='application/zip'||f.type==='application/x-zip-compressed'){
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      for(const n of Object.keys(z.files)){const e=z.files[n];if(e.dir||/__MACOSX|\/\./.test(n)||!/\.pdf$/i.test(n))continue;pdfs.push({nome:n,buf:await e.async('arraybuffer')})}
    }else if(/\.pdf$/i.test(f.name))pdfs.push({nome:f.name,buf:await f.arrayBuffer()});
  }
  if(!pdfs.length)throw new Error('Não encontrei PDFs. Envie o arquivo .zip da folha ou os PDFs.');
  const itens=[];
  for(const a of pdfs){const r=await lerPDF(a.buf);r.itens.forEach(x=>{x.arquivo=a.nome;itens.push(x)});r.falhas.forEach(p=>falhas.push(`${a.nome} (página ${p})`))}
  const folha=(await sb.from('folha_dados').select('colaborador_id,codigo')).data||[];
  const porCod={};folha.forEach(f=>{if(f.codigo)porCod[String(f.codigo).trim()]=f.colaborador_id});
  const ativos=S.emps.filter(e=>e.ativo!==false);
  itens.forEach(g=>{
    const n=normNome(g.nome),porNome=ativos.filter(e=>normNome(e.nome)===n),porCodigo=porCod[g.cod]?ativos.find(e=>e.id===porCod[g.cod]):null;
    const tk=n.split(' '),aprox=ativos.filter(e=>{const k=normNome(e.nome).split(' ');return k[0]===tk[0]&&k[k.length-1]===tk[tk.length-1]});
    if(porNome.length===1){g.empId=porNome[0].id;g.conf='certo'}
    else if(porCodigo&&(!porNome.length||porNome.some(e=>e.id===porCodigo.id))){g.empId=porCodigo.id;g.conf=normNome(porCodigo.nome)===n?'certo':'revisar'}
    else if(aprox.length===1){g.empId=aprox[0].id;g.conf='revisar'}
    else{g.empId='';g.conf='sem'}
    g.sel=g.conf==='certo';
  });
  return {itens,falhas};
}

    const step=max>80?40:(max>40?20:(max>16?8:4));let grid='';for(let v=0;v<=max;v+=step)grid+=`<line x1="${pl}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${v}h</text>`;
    const bars=days.map((x,i)=>{const cx=pl+i*bw+bw/2,bwid=Math.min(28,bw*.55);return `<rect x="${cx-bwid/2}" y="${y(x.w)}" width="${bwid}" height="${Math.max(0,H-pb-y(x.w))}" rx="3" fill="${x.ds===td?'var(--glow)':'var(--accent)'}"><title>${fmtDate(x.ds)}: ${x.w.toFixed(1)}h trabalhadas, ${x.ex.toFixed(1)}h previstas</title></rect>${x.ex?`<line x1="${cx-bwid/2-4}" x2="${cx+bwid/2+4}" y1="${y(x.ex)}" y2="${y(x.ex)}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 2"/>`:''}<text x="${cx}" y="${H-8}" text-anchor="middle">${x.ds.slice(8)}/${x.ds.slice(5,7)}</text>`}).join('');
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto" role="img" aria-label="Horas trabalhadas por dia">${grid}${bars}</svg>`;
  }

    const y1=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);const ym=marksOf(e.id,dstr(y1));
    if(ym.length&&tdi.marks.length){const gap=(parseD(tdi.marks[0].ts)-parseD(ym[ym.length-1].ts))/6e4;if(gap<660)al.push(['bad',`${e.nome}: interjornada de ${dur(gap)}`,'Mínimo de 11h entre jornadas (CLT art. 66)'])}
    for(let b=1;b<8;b++){const x=dstr(new Date(d.getFullYear(),d.getMonth(),d.getDate()-b));if((e.admissao&&x<e.admissao)||x<(S.config.inicioPonto||''))break;const di=dayInfo(e,x);if(di.status==='incompleto'){al.push(['warn',`${e.nome} tem marcação incompleta em ${fmtDate(x)}`,'Falta registrar uma saída']);break}if(di.status==='falta'){al.push(['bad',`${e.nome} faltou em ${fmtDate(x)} sem justificativa`,'Nenhuma marcação no dia']);break}}

  const col={warn:'var(--warn)',bad:'var(--bad)',info:'var(--info)'};
  return `<div class="page-h"><div><div class="eyebrow">${esc(fmtLong(d))}</div><h1>Painel de presença</h1></div><div class="spacer"></div>${holOf(td)?`<span class="chip warn">Feriado · ${esc(holOf(td))}</span>`:''}<span class="chip ok">Ao vivo · ${clockHTML()}</span></div>
  <section class="kpis">

    <button class="card kpi kpi-btn" data-act="kpi-lista" data-v="int"><span class="l">Em intervalo</span><span class="v">${cnt('Em intervalo')}</span><span class="kpi-more">Ver lista</span></button>
    <button class="card kpi kpi-btn" data-act="kpi-lista" data-v="nreg"><span class="l">Não registraram</span><span class="v" style="color:${cnt('Não registrou')?'var(--bad)':'inherit'}">${cnt('Não registrou')}</span><span class="kpi-more">Ver lista</span></button>
    <button class="card kpi kpi-btn" data-act="kpi-lista" data-v="atr"><span class="l">Atrasos hoje</span><span class="v" style="color:${late?'var(--warn)':'inherit'}">${late}</span><span class="kpi-more">Ver lista</span></button>

  </section>
  <div class="cols">

      <div style="max-height:520px;overflow:auto">${al.length?al.map(a=>`<div class="alert-i"><span class="dot" style="background:${col[a[0]]}"></span><div><div style="font-weight:600;font-size:.9rem">${esc(a[1])}</div><div class="muted" style="font-size:.8rem">${esc(a[2])}</div></div></div>`).join(''):'<div class="empty">Nenhum alerta no momento.</div>'}</div></section>

function sugereLogin(nome){
  const t=nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').split(' ').filter(Boolean);
  if(!t.length)return '';
  const skip=['junior','jr','filho','neto','sobrinho','de','da','do','dos','das','e'];
  let ult='';for(let i=t.length-1;i>0;i--){if(!skip.includes(t[i])){ult=t[i];break}}
  let base=t[0]+(ult?'.'+ult:''),c=base,n=1;
  while(S.emps.some(x=>x.login.toLowerCase()===c)){n++;c=base+n}
  return c;
}

let CAP=null;
function stopCam(){}
/* Localização precisa: acompanha o GPS por alguns segundos e fica com a melhor leitura.
   Leituras aproximadas (rede, Wi-Fi ou IP) chegam a errar dezenas de km e não são aceitas. */
const precisaoMax=()=>+(S.config&&S.config.precisao)||100;
function getGeo(onUpd,tempo){return new Promise(res=>{
  if(!navigator.geolocation)return res(null);
  let best=null,done=false,wid=null,erro=null;
  const fim=()=>{if(done)return;done=true;clearTimeout(t);if(wid!=null)navigator.geolocation.clearWatch(wid);res(best?best:(erro?{erro}:null))};
  const t=setTimeout(fim,tempo||20000);
  try{wid=navigator.geolocation.watchPosition(p=>{const g={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
      // descarta posição antiga guardada no aparelho e leituras sem margem válida
      if(!(g.acc>0)||!isFinite(g.lat)||!isFinite(g.lng)||(p.timestamp&&Math.abs(Date.now()-p.timestamp)>30000))return;
      if(!best||g.acc<best.acc)best=g;if(onUpd)onUpd(best);if(best.acc<=25)fim()},
    e=>{erro=e&&e.code===1?'negado':'falha';if(e&&e.code===1)fim()},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000})}catch(e){fim()}
})}
function geoStatus(g,final){const el=$('#geo-st');if(!el)return;const lim=precisaoMax();const sp=el.querySelector('span');
  if(!g||g.erro){el.dataset.st=final?'erro':'busca';sp.textContent=g&&g.erro==='negado'?'A localização está bloqueada. Toque no cadeado ao lado do endereço do site e permita a localização.':(final?'Não foi possível obter a localização. Ative o GPS do aparelho e tente de novo.':'Obtendo a sua localização pelo GPS…');return}
  const a=Math.round(g.acc);
  if(a<=lim){el.dataset.st='ok';sp.textContent=`Localização precisa capturada (margem de ${a} m)`}
  else{el.dataset.st=final?'erro':'busca';sp.textContent=final?`Localização imprecisa (margem de ${a>=1000?(a/1000).toFixed(1).replace('.',',')+' km':a+' m'}). Ative o GPS e a "localização precisa" do aparelho, vá para perto de uma janela e toque em Tentar de novo.`:`Melhorando a precisão… margem atual de ${a>=1000?(a/1000).toFixed(1).replace('.',',')+' km':a+' m'}`}
  const b=$('#geo-retry');if(b)b.hidden=!(final&&(!g||g.erro||a>lim))}
function iniciarGeo(){UI.geoBest=null;const el=$('#geo-st');if(el){el.dataset.st='busca';el.querySelector('span').textContent='Obtendo a sua localização pelo GPS…'}const b=$('#geo-retry');if(b)b.hidden=true;
  UI.geoP=getGeo(g=>{UI.geoBest=g;geoStatus(g,false)}).then(g=>{geoStatus(g,true);return g});}

let PDF_OK=null;
function carregaPdf(){
  if(PDF_OK)return PDF_OK;
  const um=([src,sri])=>new Promise((ok,erro)=>{const s=document.createElement('script');s.src=src;s.integrity=sri;s.crossOrigin='anonymous';s.referrerPolicy='no-referrer';s.onload=ok;s.onerror=()=>erro(new Error('Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.'));document.head.appendChild(s)});
  PDF_OK=um(PDF_LIBS[0]).then(()=>um(PDF_LIBS[1])).catch(e=>{PDF_OK=null;throw e});
  return PDF_OK;
}

function csvMirror(eid,ym){const e=emp(eid),ms=monthSummary(e,ym),td=today();const L=[['Data','Dia','Entrada','Saída intervalo','Retorno','Saída','Trabalhado','Saldo','Situação'].join(';')];ms.days.filter(d=>d.ds<=td&&d.status!=='futuro'&&d.status!=='pre').forEach(di=>{const m=di.marks.map(x=>x.ts.slice(11,16));L.push([fmtDate(di.ds),DOW[di.dow],m[0]||'',m[1]||'',m[2]||'',m[3]||'',dur(di.credit),saldoTxt(di.saldo),ST[di.status][0]].join(';'))});L.push(['Total','','','','','',dur(ms.worked),saldoTxt(ms.saldo),''].join(';'));saveFile(`espelho_${e.login.split('@')[0]}_${ym}.csv`,L.join('\n'))}
function csvReport(ym){const L=[['Login','Nome','Vínculo','Trabalhado','Previsto','Horas extras','Saldo','Atrasos','Faltas'].join(';')];S.emps.filter(e=>e.ativo).forEach(e=>{const m=monthSummary(e,ym);L.push([e.login,e.nome,e.vinculo||e.depto,dur(m.worked),dur(m.exp),dur(m.extra),saldoTxt(m.saldo),m.atrasos,m.faltas].join(';'))});saveFile(`fechamento_ponto_${ym}.csv`,L.join('\n'))}
function afd(ym){const cn=S.company.cnpj.replace(/\D/g,'');const L=[`000000000|1|1|${cn}|${S.company.razao}|${ym}|layout simplificado`];S.punches.filter(p=>p.ts.startsWith(ym)).sort((a,b)=>a.nsr-b.nsr).forEach(p=>{const e=emp(p.empId)||{};L.push([String(p.nsr).padStart(9,'0'),'7',p.ts,e.cpf||'',e.matricula||'',p.metodo,(p.hash||'').slice(0,16)].join('|'))});L.push(`999999999|${L.length-1} registros`);saveFile(`AFD_${cn}_${ym}.txt`,L.join('\n'))}

/* ================= SESSÃO ================= */
const getConvite=()=>ss.get('batida.convite');
const inApp=()=>/WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|LinkedInApp|Snapchat|TikTok|; wv\)/i.test(navigator.userAgent||'');
const isAndroid=()=>/Android/i.test(navigator.userAgent||'');
function linkConvite(){const t=getConvite();return SITE+(t?'?convite='+t:'')}
function avisoInApp(){
  if(!inApp())return '';
  const url=linkConvite();const intent=isAndroid()?'intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;end':'';
  return `<div class="notice inapp"><b>Abra este link no navegador do celular.</b> O Google não permite entrar pelo navegador interno do WhatsApp ou de outros aplicativos.
    ${isAndroid()?`<a class="btn primary" href="${esc(intent)}">Abrir no Chrome</a>`:'<span>No iPhone, toque em <b>⋯</b> ou no ícone de compartilhar e escolha <b>Abrir no Safari</b>.</span>'}
    <button type="button" class="btn" data-act="copiar-link">Copiar link</button></div>`;
}
const temConsent=(tipo)=>ME&&(ME.consent||[]).some(c=>c.tipo===tipo&&!c.revogado_em&&(tipo!=='termos'||c.versao===S.config.termoVersao));
async function afterLogin(){
  const perfil=UI.loginRole==='rh'?'rh':'emp';
  const {data:{user}}=await sb.auth.getUser();
  if(!user){MODE='login';return}
  const provs=(user.app_metadata&&user.app_metadata.providers)||[];
  const {data,error}=await sb.from('colaboradores').select(CCOLS).eq('user_id',user.id).maybeSingle();
  if(error){await sb.auth.signOut();BOOT.msg=errMsg(error);MODE='login';return}
  if(!data){
    // Conta Google sem convite: a conta é descartada no servidor
    try{await invoke({acao:'descartar'})}catch(e){}
    await sb.auth.signOut();BOOT.msg='Esta conta não está cadastrada no Registro de Ponto. Use o link de convite enviado pelo RH.';MODE='login';return;
  }
  if(!data.ativo){await sb.auth.signOut();BOOT.msg='Seu acesso não está ativo. Fale com o RH.';MODE='login';return}
  ME=mapEmp(data);ME.google=provs.includes('google')&&!provs.includes('email');
  {const md=user.user_metadata||{};const gf=String(md.avatar_url||md.picture||'');ME.foto=/^https:\/\/[a-z0-9-]+\.googleusercontent\.com\//.test(gf)?gf:''}
  if(perfil==='rh'&&ME.papel!=='rh'){await sb.auth.signOut();ME=null;BOOT.msg='Seu usuário não tem acesso ao painel do RH. Escolha "Colaborador" para bater o ponto.';MODE='login';return}
  safeStorage.setItem('batida.perfil',perfil);
  if(perfil==='rh'){
    const {data:a}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();
    AAL=(a&&a.currentLevel)||'aal1';
    try{const r=await sb.rpc('mfa_exigida');MFA_REQ=r.error?true:r.data!==false}catch(e){MFA_REQ=true}
    if(AAL!=='aal2'&&MFA_REQ){MODE=a&&a.nextLevel==='aal2'?'mfa':'mfa-enroll';UI.mfa=null;BOOT.msg='';return}
  }else AAL='aal1';
  const cs=await sb.from('consentimentos').select('tipo,versao,revogado_em').eq('colaborador_id',ME.id);
  ME.consent=cs.data||[];
  await loadAll();
  BOOT.msg='';
  MODE=proximaTela(perfil);
  subscribe();bumpIdle();
}
function proximaTela(perfil){
  if(!temConsent('termos'))return 'termos';
  if(ME.trocarSenha)return 'senha';
  if(!ME.temPin&&perfil!=='rh')return 'pin';
  return perfil==='rh'?'rh':'emp';
}
async function aceitarConvite(tok){
  let ac={};try{ac=JSON.parse(ss.get('batida.aceite')||'{}')}catch(e){}
  const {error}=await sb.rpc('aceitar_convite',{p_token:tok,p_termos:!!ac.termos,p_biometria:false});
  if(error){
    // Quem já está vinculado e abriu o link de novo entra direto, sem erro
    try{const {data:me}=await sb.rpc('meu_colab');if(me){ss.del('batida.convite');ss.del('batida.aceite');UI.loginRole='emp';await afterLogin();return}}catch(e){}
    BOOT.conviteErro=errMsg(error);MODE='convite';try{const r=await sb.rpc('ver_convite',{p_token:tok});BOOT.convite=r.data||{valido:false}}catch(e){}return}
  ss.del('batida.convite');ss.del('batida.aceite');UI.loginRole='emp';
  await afterLogin();
  toast('Conta vinculada com sucesso');
}
async function boot(){
  render();
  const qs=new URLSearchParams(location.search);
  const tk=qs.get('convite');if(tk&&/^[a-f0-9]{48}$/.test(tk))ss.set('batida.convite',tk);
  const oerr=qs.get('error_description');if(oerr)BOOT.msg='O Google não concluiu o acesso: '+oerr;
  try{const t0=Date.now();const {data}=await sb.rpc('agora');if(data)OFF=new Date(data).getTime()-Math.round((t0+Date.now())/2)}catch(e){}
  let sess=null;
  try{const {data}=await sb.auth.getSession();sess=data.session}catch(e){BOOT.msg=errMsg(e)}
  if(location.search)history.replaceState(null,'',location.pathname);
  const pend=getConvite();
  try{
    if(pend&&sess)await aceitarConvite(pend);
    else if(pend){const r=await sb.rpc('ver_convite',{p_token:pend});BOOT.convite=r.data||{valido:false};MODE='convite'}
    else if(sess)await afterLogin();
  }catch(e){BOOT.msg=errMsg(e);MODE='login'}
  if(MODE==='login'){try{const {data}=await sb.rpc('existe_rh');BOOT.existeRH=data!==false}catch(e){}}
  BOOT.loading=false;render();
}
async function logout(msg){
  LOADED_FROM=null;clearTimeout(idleT);if(CH){sb.removeChannel(CH);CH=null}
  try{await sb.auth.signOut()}catch(e){}
  ME=null;AAL='aal1';MODE='login';S.emps=[];S.punches=[];S.requests=[];S.aprov=[];S.convites=[];S.setores=[];UI.empTab='ponto';UI.rhTab='painel';UI.audit=null;UI.mfa=null;
  BOOT.msg=typeof msg==='string'?msg:'';render();
}
// Encerra a sessão depois de um tempo sem uso
let idleT=null;
function bumpIdle(){
  clearTimeout(idleT);
  if(!ME||MODE==='login'||MODE==='convite')return;
  const min=MODE==='rh'?15:30;
  idleT=setTimeout(()=>{closeModal();logout(`Sessão encerrada após ${min} minutos sem uso.`)},min*60000);
}
['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>bumpIdle(),{passive:true}));

document.addEventListener('submit',async ev=>{

    const login=fd.login.trim().toLowerCase();
    const email=login.includes('@')?login:`${login}@${LOGIN_DOM}`;
    const {error}=await sb.auth.signInWithPassword({email,password:fd.senha});
    if(error){showErr(error.message.includes('Invalid')?'Login ou senha incorretos.':errMsg(error));if(btn)btn.disabled=false;return}
    BOOT.loading=true;render();await afterLogin();BOOT.loading=false;render();return;
  }
  if(k==='bootstrap'){
    if(fd.senha!==fd.senha2){showErr('As senhas não conferem.');if(btn)btn.disabled=false;return}
    const login=fd.login.trim().toLowerCase();
    await invoke({acao:'bootstrap',nome:fd.nome.trim(),login,senha:fd.senha});
    const {error}=await sb.auth.signInWithPassword({email:login.includes('@')?login:`${login}@${LOGIN_DOM}`,password:fd.senha});if(error)throw error;
    BOOT.existeRH=true;BOOT.loading=true;render();await afterLogin();BOOT.loading=false;render();toast('Acesso do RH criado');return;

    if(!geo||geo.erro){UI.geoP=null;volta(geo&&geo.erro==='negado'?'A localização está bloqueada neste navegador. Toque no cadeado ao lado do endereço do site, permita a localização e tente de novo.':'Não foi possível obter a sua localização. Ative o GPS do aparelho e toque em Tentar de novo.');return}

    if(!senhaForte(fd.senha)){showErr(MSG_SENHA);if(btn)btn.disabled=false;return}
    const r=await invoke({acao:'criar-acessos',senha:fd.senha});await loadAll();closeModal();
    toast(`${r.criados} acesso(s) criado(s)${r.falhas&&r.falhas.length?`, ${r.falhas.length} com erro`:''}`);
    if(r.falhas&&r.falhas.length)openModal(`<div class="modal-h"><h3>Acessos com erro</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">${r.falhas.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}</div>`);
    return;
  }
  if(k==='req'&&fd.tipo==='abonada'){
    const s=saldoAbonadas(ME,+fd.data.slice(0,4)),c=s.c,dd=parseD(fd.data);
    if(!jor(ME.jornadaId).dias.includes(dd.getDay()))throw new Error('Esse dia não é dia de trabalho na sua jornada.');
    if(holOf(fd.data))throw new Error('Esse dia é feriado. Escolha um dia de trabalho.');
    if(s.lib&&fd.data<s.lib)throw new Error(`A primeira falta abonada só pode ser a partir de ${fmtDate(s.lib)}.`);
    if(!s.disp)throw new Error(`Você já usou as ${c.ano} faltas abonadas de ${s.ano}.`);
    const sem=+fd.data.slice(5,7)<=6?s.s1:s.s2;if(sem>=c.sem)throw new Error(`O limite é de ${c.sem} faltas abonadas por semestre.`);
    const perto=s.ab.find(r=>Math.abs((parseD(r.data)-dd)/864e5)<c.intervalo);if(perto)throw new Error(`É preciso um intervalo de pelo menos ${c.intervalo} dias entre faltas abonadas. Você já tem uma em ${fmtDate(perto.data)}.`);
    const {error}=await sb.from('solicitacoes').insert({colaborador_id:ME.id,tipo:'abonada',data:fd.data,ate:fd.data,motivo:(fd.motivo||'').trim()||'Falta abonada'});
    if(error)throw error;await loadAll();closeModal();UI.empTab='solic';render();toast('Pedido de falta abonada enviado ao RH');return;
  }
  if(k==='req'){
    const inp=f.querySelector('[name=anexo]');const fls=inp?[...inp.files]:[];
    if(fls.length>5)throw new Error('Envie no máximo 5 arquivos.');
    const okT=/^(image\/(jpeg|png|webp|heic)|application\/pdf)$/;
    for(const fl of fls){if(fl.size>10485760)throw new Error(`O arquivo ${fl.name} passa de 10 MB.`);if(!okT.test(fl.type||''))throw new Error(`O arquivo ${fl.name} não é foto nem PDF.`)}
    if((fd.tipo==='atestado'||fd.tipo==='licenca')&&!fls.length)throw new Error('Anexe o documento para este tipo de solicitação.');
    if(fd.ate&&fd.ate<fd.data)throw new Error('A data final não pode ser antes da inicial.');
    if(fd.tipo==='ajuste'&&fd.motivo.trim().length<10)throw new Error('Explique por que a marcação precisa ser manual (pelo menos 10 caracteres).');
    if(fd.tipo==='ajuste'&&fd.data>today())throw new Error('Não é possível fazer marcação manual em data futura.');
    const anexos=[];
    for(const fl of fls){if(btn)btn.textContent=`Enviando ${anexos.length+1} de ${fls.length}…`;const path=`${ME.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}-${fl.name.replace(/[^\w.\-]+/g,'_').slice(-80)}`;const up=await sb.storage.from('anexos').upload(path,fl,{contentType:fl.type});if(up.error)throw up.error;anexos.push({path,nome:fl.name.slice(0,120)})}
    const base={colaborador_id:ME.id,data:fd.data,ate:fd.ate||null,hora:fd.hora||null,anexo_path:anexos[0]?anexos[0].path:null,anexo_nome:anexos[0]?anexos[0].nome:null};
    let {error}=await sb.from('solicitacoes').insert({...base,tipo:fd.tipo,subtipo:fd.subtipo||null,motivo:fd.motivo.trim(),anexos});
    if(error&&/anexos|subtipo|tipo_check|schema cache/i.test(error.message||'')){
      const extra=anexos.length>1?' [Outros anexos: '+anexos.slice(1).map(x=>x.nome).join(', ')+']':'';
      ({error}=await sb.from('solicitacoes').insert({...base,tipo:['justificativa','licenca'].includes(fd.tipo)?'abono':fd.tipo,motivo:((fd.tipo==='licenca'?(fd.subtipo||'Licença')+': ':fd.tipo==='justificativa'?'Justificativa: ':'')+fd.motivo.trim()+extra).slice(0,1500)}));
    }
    if(error)throw error;await loadAll();closeModal();UI.empTab='solic';render();toast(fd.tipo==='ajuste'?'Marcação manual enviada para aprovação do gestor':'Solicitação enviada ao RH');return;
  }
  if(k==='emp'){
    const id=f.dataset.id;
    if(fd.senha&&!senhaForte(fd.senha))throw new Error(MSG_SENHA);
    const login=fd.login.trim().toLowerCase();
    if(!loginOk(login))throw new Error('Login inválido. Use letras minúsculas, números, ponto, hífen ou sublinhado (3 a 40 caracteres), sem espaços nem acentos.');
    if(S.emps.some(x=>x.id!==id&&x.login.toLowerCase()===login))throw new Error('Esse login já está em uso.');
    const dados={nome:fd.nome.trim(),cargo:fd.cargo.trim(),vinculo:fd.vinculo.trim(),setor_id:fd.setorId||null,email:fd.email.trim().toLowerCase(),cpf:fd.cpf.trim(),admissao:fd.admissao||null,jornada_id:fd.jornadaId,papel:fd.papel,direito_abonada:fd.abonada!=='0'};
    if(!id){
      const nv=await invoke({acao:'criar',senha:fd.senha,dados:Object.assign({login},dados)});
      if(!dados.direito_abonada&&nv&&nv.id)await sb.from('colaboradores').update({direito_abonada:false}).eq('id',nv.id);
      await loadAll();closeModal();credModal(dados.nome,login,fd.senha);return;
    }
    const old=emp(id);
    if(id===ME.id&&dados.papel!=='rh')throw new Error('Você não pode remover o seu próprio perfil de RH.');
    const {error}=await sb.from('colaboradores').update(dados).eq('id',id);if(error)throw error;
    if(login!==old.login.toLowerCase())await invoke({acao:'login',colaborador_id:id,login});
    const ativo=fd.ativo==='1';if(ativo!==old.ativo)await invoke({acao:'acesso',colaborador_id:id,ativo});
    if(fd.senha)await invoke({acao:'senha',colaborador_id:id,senha:fd.senha});
    await loadAll();closeModal();
    if(fd.senha)credModal(dados.nome,login,fd.senha);else toast(login!==old.login.toLowerCase()?`Cadastro atualizado. Novo login: ${login}`:'Cadastro atualizado');
    return;
  }
  if(k==='jor'){
    const id=f.dataset.id;const dias=DOW.map((_,i)=>fd['d'+i]?i:-1).filter(i=>i>=0);
    if(!dias.length)throw new Error('Marque pelo menos um dia de trabalho.');
    const row={nome:fd.nome.trim(),ini:fd.ini,int_ini:fd.intIni,int_fim:fd.intFim,fim:fd.fim,tol:Math.min(10,Math.max(0,+fd.tol||0)),dias};
    const {error}=id?await sb.from('jornadas').update(row).eq('id',id):await sb.from('jornadas').insert(row);if(error)throw error;
    await loadAll();closeModal();toast('Jornada salva');return;
  }
  if(k==='addp'){const {error}=await sb.rpc('incluir_marcacao',{p_colab:f.dataset.id,p_ts:brIso(fd.data,fd.hora),p_obs:fd.obs});if(error)throw error;await loadAll({punches:true});closeModal();toast('Marcação incluída');return}
  if(k==='ab-lib'){const {error}=await sb.rpc('liberar_abonada',{p_id:f.dataset.id,p_status:f.dataset.v,p_obs:fd.obs||''});if(error)throw error;await loadAll();closeModal();toast(f.dataset.v==='liberado'?'Pedido encaminhado ao gestor':'Pedido recusado e colaborador avisado');return}
  if(k==='dec'){const {error}=await sb.rpc('decidir_solicitacao',{p_id:f.dataset.id,p_status:f.dataset.v,p_resposta:fd.resposta||(f.dataset.v==='aprovado'?'Aprovado.':'')});if(error)throw error;await loadAll({punches:true});closeModal();toast(f.dataset.v==='aprovado'?'Solicitação aprovada':'Solicitação recusada');return}
  if(k==='u-reset'){
    const id=f.dataset.id;if(!fd.motivo||fd.motivo.trim().length<3)throw new Error('Informe o motivo.');
    await invoke({acao:'reiniciar',colaborador_id:id,apagar_pin:!!fd.pin,motivo:fd.motivo.trim()});
    await loadAll();toast('Acesso reiniciado. Agora gere o novo convite.');inviteForm(id);return;
  }
  if(k==='cfg'){
    if(fd.ativa==='1'&&!(S.locais||[]).length)throw new Error('Para ativar a cerca virtual, adicione pelo menos um local de trabalho.');
    const {error}=await sb.from('empresa').update({razao:fd.razao.trim(),cnpj:fd.cnpj.trim(),local:fd.local.trim(),cerca_ativa:fd.ativa==='1',cerca_bloquear:fd.bloquear==='1',modo_senha:fd.modoSenha==='revisao'?'revisao':'permitida',facial_ativo:false,exigir_mfa:fd.mfa==='1',dia_fechamento:Math.min(10,Math.max(1,+fd.diaFech||5)),inicio_ponto:fd.inicioPonto||null,precisao_max:Math.min(150,Math.max(20,+fd.precisao||100)),abonada_analistas:Object.keys(fd).filter(k=>k.startsWith('an_')).map(k=>k.slice(3)),atualizado_em:new Date().toISOString()}).eq('id',1);
    if(error)throw error;await loadAll();render();toast('Configurações salvas');return;
  }
  }catch(err){showErr(errMsg(err));if(btn)btn.disabled=false}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});

if(!window.supabase){document.getElementById('app').innerHTML='<div class="empty">Não foi possível carregar a conexão com o servidor. Verifique a internet e recarregue a página.</div>'}else boot();
})();
</script>
</body>
</html>
