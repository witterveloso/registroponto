<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ponto FTVTEC</title>
<meta name="theme-color" content="#0A1628">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: login dividido (painel escuro + formulário); app do colaborador mobile-first com abas; painel RH com barra lateral que vira abas no celular */
:root{
  --bg:#EDF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --ink:#0D1A2B; --muted:#5A6B82; --line:#D8E0E9;
  --accent:#0A7B84; --accent-ink:#FFFFFF; --accent-soft:#DCF1F1; --glow:#17C9B6;
  --deep:#0A1628; --deep-2:#12223A; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#223552;
  --ok:#157F51; --ok-bg:#E0F2E8; --warn:#9A6600; --warn-bg:#FBEFD5; --bad:#B9362C; --bad-bg:#FAE3E0; --info:#2C5BC4; --info-bg:#E3EAFA;
  --shadow:0 1px 2px rgba(13,26,43,.06),0 8px 24px rgba(13,26,43,.06);
  --f-display:'Sora','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111E; --surface:#0F1B2D; --surface-2:#132238; --ink:#E5EDF6; --muted:#8C9FB8; --line:#22334B;
  --accent:#2CC4B4; --accent-ink:#04201D; --accent-soft:#103534; --glow:#3FE0CC;
  --deep:#0B1626; --deep-2:#122139; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#25395A;
  --ok:#4CC88C; --ok-bg:#12321F; --warn:#E3B04B; --warn-bg:#3A2C0C; --bad:#F07A6E; --bad-bg:#3E1714; --info:#7FA4F5; --info-bg:#172A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111E; --surface:#0F1B2D; --surface-2:#132238; --ink:#E5EDF6; --muted:#8C9FB8; --line:#22334B;
  --accent:#2CC4B4; --accent-ink:#04201D; --accent-soft:#103534; --glow:#3FE0CC;
  --deep:#0B1626; --deep-2:#122139; --deep-ink:#E6EFF8; --deep-muted:#8EA3BE; --deep-line:#25395A;
  --ok:#4CC88C; --ok-bg:#12321F; --warn:#E3B04B; --warn-bg:#3A2C0C; --bad:#F07A6E; --bad-bg:#3E1714; --info:#7FA4F5; --info-bg:#172A4D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:6px}

/* Buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.input,select.input,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink)}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.plain::before{display:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:16px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.pos{color:var(--ok)}.neg{color:var(--bad)}
tr.weekend td{color:var(--muted);background:color-mix(in srgb,var(--surface-2) 60%,transparent)}

/* Brand mark */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--glow),#2C6BD8);color:#04121F;flex:none}
.mark svg{width:18px;height:18px}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-hero{background:var(--deep);color:var(--deep-ink);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding-block:40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px}
.login-hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:44px 44px;opacity:.45;mask-image:radial-gradient(ellipse at 70% 40%,#000 0%,transparent 70%)}
.login-hero>*{position:relative}
.hero-clock{font-family:var(--f-mono);font-size:clamp(3rem,7vw,5.4rem);font-weight:500;letter-spacing:-.04em;line-height:1;color:#fff}
.hero-clock .sec{color:var(--glow)}
.hero-date{color:var(--deep-muted);margin-top:10px;font-size:1rem;text-transform:capitalize}
.hero-feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:560px}
.hero-feat{border-top:1px solid var(--deep-line);padding-top:12px}
.hero-feat b{display:block;font-family:var(--f-display);font-size:.92rem;color:#fff;margin-bottom:2px}
.hero-feat span{font-size:.82rem;color:var(--deep-muted)}
.login-form{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;padding:9px;border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.demo-box{border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:.84rem;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.demo-list{display:flex;flex-wrap:wrap;gap:6px}
.demo-list button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:.78rem;cursor:pointer;color:var(--ink)}
.demo-list button:hover{border-color:var(--accent)}
.err{color:var(--bad);font-size:.85rem}

/* ---------- COLABORADOR ---------- */
.emp{max-width:760px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:.85rem;background:var(--accent-soft);color:var(--accent);flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.clockcard{background:var(--deep);color:var(--deep-ink);border-radius:16px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:18px}
.clockcard::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--glow) 28%,transparent),transparent 70%)}
.clockcard>*{position:relative;z-index:1}
.big-clock{font-family:var(--f-mono);font-size:clamp(2.8rem,12vw,4.2rem);line-height:1;font-weight:500;letter-spacing:-.04em;color:#fff}
.big-clock .sec{color:var(--glow);font-size:.55em}
.cc-meta{display:flex;gap:8px;flex-wrap:wrap}
.cc-meta .chip{background:var(--deep-2);color:var(--deep-ink);border-color:var(--deep-line)}
.punch-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:16px;border-radius:12px;border:0;background:var(--glow);color:#04201D;font-family:var(--f-display);font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:0 8px 30px color-mix(in srgb,var(--glow) 35%,transparent)}
.punch-btn:hover{filter:brightness(1.05)}
.punch-btn svg{width:24px;height:24px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;min-width:0}
.slot .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .t{font-family:var(--f-mono);font-size:1.15rem;font-weight:500}
.slot .e{font-size:.72rem;color:var(--muted)}
.slot.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.slot.done .t{color:var(--accent)}
.slot.next{border-style:dashed;border-color:var(--accent)}
.slot.empty .t{color:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--f-mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.78rem;color:var(--muted);font-weight:500}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:760px}
.tabbar button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.72rem;font-weight:600;color:var(--muted);cursor:pointer}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sub{font-size:.82rem;color:var(--muted)}

/* ---------- RH ---------- */
.rh{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--deep);color:var(--deep-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .brand{color:#fff;padding:0 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--deep-muted);padding:9px 10px;border-radius:8px;font-weight:500;cursor:pointer;text-align:left;white-space:nowrap}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{color:#fff;background:var(--deep-2)}
.nav button.on{color:#fff;background:var(--deep-2);box-shadow:inset 3px 0 0 var(--glow)}
.nav .badge{margin-left:auto;background:var(--glow);color:#04201D;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 7px}
.side-foot{margin-top:auto;font-size:.8rem;color:var(--deep-muted);display:flex;flex-direction:column;gap:10px;padding:0 6px}
.side-foot .btn{background:transparent;color:var(--deep-ink);border-color:var(--deep-line)}
.main{min-width:0;padding-block:24px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h .spacer{min-width:10px}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.cols>*{min-width:0}
.now-status{display:flex;flex-direction:column;gap:2px;align-items:flex-end;text-align:right}
.alert-i{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
.alert-i:last-child{border-bottom:0}
.alert-i .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.req{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start;flex-wrap:wrap}
.req:last-child{border-bottom:0}
.req .grow{flex:1;min-width:220px}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:.9rem}
.search{max-width:260px}

/* ---------- MODAL / CAPTURA ---------- */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(5,12,22,.62);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:100%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal.wide{max-width:640px}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1;margin-left:auto;padding:4px 8px}
.capture{background:var(--deep);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--deep-ink)}
.viewport{position:relative;width:min(260px,70vw);aspect-ratio:1;max-width:100%}
.viewport .cam{position:absolute;inset:14px;border-radius:50%;overflow:hidden;background:#050B14;display:grid;place-items:center}
.viewport video,.viewport img.snap{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.viewport img.snap{transform:none}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 70%,var(--glow) 100%);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);mask:radial-gradient(circle,transparent 63%,#000 64%,#000 67%,transparent 68%);animation:spin 2.4s linear infinite}
.ring.idle{animation-duration:6s;opacity:.6}
.ring.ok{background:var(--ok);animation:none}
.ring.bad{background:var(--bad);animation:none}
.ticks{position:absolute;inset:0}
.scanline{position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);top:20%;animation:scan 1.8s ease-in-out infinite alternate;border-radius:2px;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{to{top:78%}}
.cam-ph{color:var(--deep-muted);font-size:.85rem;text-align:center;padding:20px}
.steps{display:flex;flex-direction:column;gap:6px;width:100%;max-width:300px}
.step{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--deep-muted)}
.step i{width:16px;height:16px;border-radius:50%;border:2px solid var(--deep-line);flex:none;display:grid;place-items:center;font-style:normal;font-size:10px}
.step.run{color:#fff}.step.run i{border-color:var(--glow);border-top-color:transparent;animation:spin .8s linear infinite}
.step.ok{color:#fff}.step.ok i{background:var(--glow);border-color:var(--glow);color:#04201D}
.step.fail{color:#fff}.step.fail i{background:var(--bad);border-color:var(--bad);color:#fff}
.receipt{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-family:var(--f-mono);font-size:.8rem;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.receipt::before{content:"";position:absolute;left:0;right:0;top:-1px;height:4px;border-radius:12px 12px 0 0;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,transparent 10px 14px)}
.receipt .rl{display:flex;justify-content:space-between;gap:12px}
.receipt .rl span:first-child{color:var(--muted)}
.receipt .rl span:last-child{text-align:right;word-break:break-all}
.receipt .big{font-size:1.7rem;font-weight:500;text-align:center;color:var(--ink);padding:6px 0}
.receipt hr{border:0;border-top:1px dashed var(--line);margin:4px 0;width:100%}
.hash{word-break:break-all;color:var(--muted);font-size:.72rem}
.notice{font-size:.8rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--deep);color:#fff;padding:10px 16px;border-radius:10px;font-size:.88rem;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-hero{padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));gap:24px}
  .hero-feats{display:none}
  .rh{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:15;flex-direction:row;align-items:center;gap:12px;padding:10px 0;padding-top:max(10px,env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto}
  .side .brand span{display:none}
  .nav{flex-direction:row}
  .nav button.on{box-shadow:inset 0 -2px 0 var(--glow)}
  .side-foot{margin:0;flex-direction:row;align-items:center}
  .side-foot .who{display:none}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
  .cols{grid-template-columns:1fr}
}
@media (max-width:480px){
  .timeline{grid-template-columns:repeat(2,1fr)}
  .search{max-width:none;width:100%}
}
@media (prefers-reduced-motion:reduce){.ring,.scanline,.step.run i{animation:none}}

/* ================= CÁLCULO ================= */
function dayInfo(e,ds){
  const j=jor(e.jornadaId),d=parseD(ds),dow=d.getDay(),hol=HOL[ds],td=today();
  const marks=marksOf(e.id,ds);
  const sched=j.dias.includes(dow)&&!hol;
  const exp=sched?expMin(j):0;
  const just=S.requests.find(r=>r.empId===e.id&&r.status==='aprovado'&&r.tipo!=='ajuste'&&ds>=r.data&&ds<=(r.ate||r.data));
  let worked=0,open=false;
  for(let i=0;i<marks.length;i+=2){const a=tsMin(marks[i].ts);if(marks[i+1])worked+=tsMin(marks[i+1].ts)-a;else if(ds===td){worked+=Math.max(0,nowMin()-a);open=true}}
  const incomplete=marks.length%2===1&&ds<td;
  let credit=worked;if(just&&sched)credit=Math.max(worked,exp);
  let saldo=credit-exp;if(Math.abs(saldo)<=j.tol&&sched)saldo=0;
  const late=sched&&marks[0]?tsMin(marks[0].ts)-toMin(j.ini):0;const atraso=late>5?late:0;
  let status;
  if(ds>td)status='futuro';
  else if(hol)status=marks.length?'extra':'feriado';
  else if(!j.dias.includes(dow))status=marks.length?'extra':'folga';
  else if(just)status=just.tipo==='ferias'?'ferias':'abonado';
  else if(!marks.length)status=ds<td?'falta':(nowMin()>toMin(j.ini)+30?'ausente':'aguardando');
  else if(incomplete)status='incompleto';
  else if(atraso)status='atraso';
  else if(ds<td&&saldo>0)status='extra';
  else status='ok';
  const final=ds<td||(marks.length>=4&&!open);
  return{ds,dow,hol,marks,sched,exp,worked,credit,saldo:final&&status!=='falta'?saldo:(status==='falta'?-exp:null),atraso,status,open,just,j};
}
const ST={ok:['Regular','ok'],atraso:['Atraso','warn'],falta:['Falta','bad'],incompleto:['Incompleto','warn'],abonado:['Abonado','info'],ferias:['Férias','info'],feriado:['Feriado','plain'],folga:['Folga','plain'],extra:['Hora extra','acc'],ausente:['Ausente','bad'],aguardando:['Aguardando','plain'],futuro:['·','plain']};
const stChip=s=>`<span class="chip ${ST[s][1]}">${ST[s][0]}</span>`;
function monthDays(ym){const[y,m]=ym.split('-').map(Number);const n=new Date(y,m,0).getDate();return Array.from({length:n},(_,i)=>`${ym}-${pad(i+1)}`)}
function monthSummary(e,ym){
  const td=today();let worked=0,exp=0,saldo=0,extra=0,atrasos=0,faltas=0,days=[];
  const adm=e.admissao||'0000';
  monthDays(ym).forEach(ds=>{const di=dayInfo(e,ds);if(ds<adm){di.status='futuro';di.saldo=null;di.credit=0;di.exp=0}days.push(di);if(ds>td||ds<adm)return;worked+=di.credit;if(ds<td||di.saldo!=null)exp+=di.exp;if(di.saldo!=null){saldo+=di.saldo;if(di.saldo>0)extra+=di.saldo}if(di.atraso)atrasos++;if(di.status==='falta')faltas++});
  return{days,worked,exp,saldo,extra,atrasos,faltas};
}
function nowState(e){
  const di=dayInfo(e,today()),n=di.marks.length;
  if(n===0){if(di.hol)return['Feriado','plain',''];if(!di.j.dias.includes(di.dow))return['Folga','plain',''];if(di.just)return[di.just.tipo==='ferias'?'Férias':'Abonado','info',''];return di.status==='ausente'?['Não registrou','bad',`Entrada prevista ${di.j.ini}`]:['Aguardando','plain',`Entrada prevista ${di.j.ini}`]}
  const last=di.marks[n-1].ts.slice(11,16);
  if(n%2===1)return['Trabalhando','ok',`desde ${last}`];
  if(n===2)return['Em intervalo','warn',`desde ${last}`];
  return['Encerrou','info',`às ${last}`];
}

  const k=e.id+'|'+ym;const alt=a&&UI.sig&&UI.sig[k]&&UI.sig[k]!==a.assinatura;
  const quem=a?((a.resumo&&a.resumo.por)||(emp(a.aprovado_por)||{nome:'Gestor'}).nome):'';
  const quando=a?localTs(a.aprovado_em):'';
  const pode=podeAprovar(e),corrente=ym===today().slice(0,7),futuro=ym>today().slice(0,7);
  const setor=setorDe(e),gestor=setor&&setor.gestor_id?emp(setor.gestor_id):null;
  let corpo;
  if(!a)corpo=`<div><div style="font-weight:600">Aguardando aprovação do gestor</div><div class="muted" style="font-size:.85rem">${gestor?'Gestor: '+esc(gestor.nome)+(setor?' · '+esc(setor.nome):''):(setor?'Setor '+esc(setor.nome)+' sem gestor definido':'Colaborador sem setor definido pelo RH')}</div></div>`;
  else if(a.status==='aprovado')corpo=`<div><div style="font-weight:600;color:${alt?'var(--warn)':'var(--ok)'}">${alt?'Aprovado, mas as marcações mudaram depois':'Ponto aprovado'}</div><div class="muted" style="font-size:.85rem">Por ${esc(quem)} em ${fmtDate(quando.slice(0,10))} às ${quando.slice(11,16)}${a.resumo?` · ${dur(a.resumo.trabalhado)} trabalhadas, saldo ${saldoTxt(a.resumo.saldo)}`:''}</div>${a.observacao?`<div style="font-size:.85rem;margin-top:2px">${esc(a.observacao)}</div>`:''}${alt?'<div style="font-size:.85rem;margin-top:2px">Alguma marcação foi incluída ou revisada após a aprovação. O gestor precisa aprovar de novo.</div>':''}</div>`;
  else corpo=`<div><div style="font-weight:600;color:var(--bad)">Devolvido para ajuste</div><div class="muted" style="font-size:.85rem">Por ${esc(quem)} em ${fmtDate(quando.slice(0,10))} às ${quando.slice(11,16)}</div><div style="font-size:.85rem;margin-top:2px">${esc(a.observacao||'')}</div></div>`;
  let acoes='';
  if(pode&&!futuro){
    if(!a||alt)acoes=`<button class="btn sm danger" data-act="ap-dev" data-id="${e.id}" data-ym="${ym}">Devolver</button><button class="btn sm primary" data-act="ap-ok" data-id="${e.id}" data-ym="${ym}">Aprovar ponto do mês</button>`;
    else acoes=`<button class="btn sm ghost" data-act="ap-reabrir" data-id="${e.id}" data-ym="${ym}">Desfazer ${a.status==='aprovado'?'aprovação':'devolução'}</button>${a.status==='devolvido'?`<button class="btn sm primary" data-act="ap-ok" data-id="${e.id}" data-ym="${ym}">Aprovar</button>`:''}`;
  }
  return `<section class="card card-b" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-left:4px solid ${!a?'var(--line)':a.status==='devolvido'?'var(--bad)':alt?'var(--warn)':'var(--ok)'}">
    <div style="flex:1;min-width:220px">${corpo}${pode&&corrente&&!a?'<div class="muted" style="font-size:.8rem;margin-top:4px">O mês ainda está em andamento. O ideal é aprovar depois do último dia.</div>':''}</div>
    <div class="row">${acoes}</div></section>`;
}
function apForm(id,ym,status){

  openModal(`<form data-form="ap" data-id="${id}" data-ym="${ym}" data-v="${status}"><div class="modal-h"><div><div class="eyebrow">${MES[+m-1]} de ${y}</div><h3>${status==='aprovado'?'Aprovar ponto':'Devolver para ajuste'}</h3></div><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">
    <div><b>${esc(e.nome)}</b><div class="muted" style="font-size:.85rem">${esc(e.cargo)}</div></div>
    <div class="receipt"><div class="rl"><span>Trabalhado</span><span>${dur(ms.worked)}</span></div><div class="rl"><span>Previsto</span><span>${dur(ms.exp)}</span></div><div class="rl"><span>Saldo</span><span>${saldoTxt(ms.saldo)}</span></div><div class="rl"><span>Horas extras</span><span>${dur(ms.extra)}</span></div><div class="rl"><span>Atrasos · faltas</span><span>${ms.atrasos} · ${ms.faltas}</span></div></div>
    <div class="field"><label for="ap-o">${status==='aprovado'?'Observação (opcional)':'O que precisa ser ajustado'}</label><textarea class="input" id="ap-o" name="obs" rows="3" ${status==='devolvido'?'required':''} placeholder="${status==='aprovado'?'Ex.: horas extras autorizadas para o evento do dia 12':'Ex.: falta registrar a saída do dia 08'}"></textarea></div>
    <div class="notice">${status==='aprovado'?'A aprovação fica registrada com o seu nome, a data e a hora. Se alguma marcação mudar depois, o sistema avisa e pede nova aprovação.':'O colaborador e o RH veem a devolução e o motivo.'}</div>
  </div><div class="modal-f"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn ${status==='aprovado'?'primary':'danger'}" type="submit">${status==='aprovado'?'Confirmar aprovação':'Devolver'}</button></div></form>`);
}

/* ---------- Gestor: minha equipe ---------- */
function empEquipe(){
  const ym=UI.teamMonth||prevMonth();const team=minhaEquipe(ym);
  if(UI.teamEmp&&team.some(x=>x.id===UI.teamEmp)){
    const e=emp(UI.teamEmp),{ms,html}=mirrorTable(e,ym);
    return `<div class="row"><button class="btn sm ghost" data-act="team-back">← Equipe</button><div class="spacer"></div><select class="input" style="width:auto" id="tm2" data-change="team-month">${monthOpts(ym)}</select></div>
    <section class="card card-b row" style="gap:12px"><div class="avatar" style="width:48px;height:48px">${e.face?`<img src="${e.face.thumb}" alt="">`:initials(e.nome)}</div><div style="flex:1;min-width:0"><h2>${esc(e.nome)}</h2><div class="muted" style="font-size:.85rem">${esc(e.cargo)} · ${esc(jor(e.jornadaId).nome)}</div></div></section>
    ${aprovBlock(e,ym,ms)}
    <section class="kpis">
      <div class="card kpi"><span class="l">Trabalhado</span><span class="v">${dur(ms.worked)}</span></div>
      <div class="card kpi"><span class="l">Saldo do mês</span><span class="v ${saldoCls(ms.saldo)}">${saldoTxt(ms.saldo)}</span></div>
      <div class="card kpi"><span class="l">Atrasos · faltas</span><span class="v">${ms.atrasos} · ${ms.faltas}</span></div>
    </section>
    <section class="card">${html}</section>`;
  }
  const rows=team.map(e=>({e,ms:monthSummary(e,ym),a:aprovDe(e.id,ym)}));
  const cnt={ok:rows.filter(r=>r.a&&r.a.status==='aprovado').length,dev:rows.filter(r=>r.a&&r.a.status==='devolvido').length};cnt.pend=rows.length-cnt.ok-cnt.dev;
  return `<div class="row"><div><div class="eyebrow">${meusSetores().map(s=>esc(s.nome)).join(' · ')}</div><h2>Minha equipe</h2></div><div class="spacer"></div><select class="input" style="width:auto" id="tm" data-change="team-month">${monthOpts(ym)}</select></div>
  <section class="kpis">
    <div class="card kpi"><span class="l">Colaboradores</span><span class="v">${rows.length}</span></div>
    <div class="card kpi"><span class="l">Aguardando aprovação</span><span class="v" style="color:${cnt.pend?'var(--warn)':'inherit'}">${cnt.pend}</span></div>
    <div class="card kpi"><span class="l">Aprovados</span><span class="v" style="color:var(--ok)">${cnt.ok}</span></div>
    <div class="card kpi"><span class="l">Devolvidos</span><span class="v" style="color:${cnt.dev?'var(--bad)':'inherit'}">${cnt.dev}</span></div>
  </section>
  ${(()=>{const nl=rows.filter(r=>!r.a&&!r.ms.faltas&&!r.ms.days.some(d=>d.status==='incompleto')).length;return nl&&ym<today().slice(0,7)})()?`<div class="row"><button class="btn primary" data-act="ap-lote" data-ym="${ym}">Aprovar todos sem pendências (${rows.filter(r=>!r.a&&!r.ms.faltas&&!r.ms.days.some(d=>d.status==='incompleto')).length})</button><span class="muted" style="font-size:.82rem">Quem tem falta ou marcação incompleta fica para você revisar um por um.</span></div>`:''}
  <section class="card"><div class="list">${rows.map(({e,ms,a})=>{const s=nowState(e);const pend=ms.faltas||ms.days.some(d=>d.status==='incompleto');return `<button class="li" style="width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;font:inherit;color:inherit" data-act="team-open" data-id="${e.id}"><div class="avatar">${e.face?`<img src="${e.face.thumb}" alt="">`:initials(e.nome)}</div><div class="grow"><div class="ttl" style="white-space:normal">${esc(e.nome)}</div><div class="sub">Hoje: ${s[0]} · Saldo ${saldoTxt(ms.saldo)} · ${ms.atrasos} atraso(s) · ${ms.faltas} falta(s)${pend?' · <span style="color:var(--warn)">revisar</span>':''}</div><div style="margin-top:4px">${aprovChip(e,ym)}</div></div><span class="muted" aria-hidden="true">›</span></button>`}).join('')||'<div class="empty">O RH ainda não incluiu colaboradores no seu setor.</div>'}</div></section>`;
}
function prevMonth(){const d=NOW();if(d.getDate()>5)return today().slice(0,7);const x=new Date(d.getFullYear(),d.getMonth()-1,1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}`}

function sugereLogin(nome){
  const t=nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,'').split(' ').filter(Boolean);
  if(!t.length)return '';
  const skip=['junior','jr','filho','neto','sobrinho','de','da','do','dos','das','e'];
  let ult='';for(let i=t.length-1;i>0;i--){if(!skip.includes(t[i])){ult=t[i];break}}
  let base=t[0]+(ult?'.'+ult:''),c=base,n=1;
  while(S.emps.some(x=>x.login.toLowerCase()===c)){n++;c=base+n}
  return c;
}

let STREAM=null,CAP=null;

  const fallback=why=>{$('#cam').innerHTML=`<div class="cam-ph">${esc(why)}<br><br>${senhaOk()&&!(enrolling&&mode==='enroll')?'Tire uma selfie com a câmera frontal ou registre com a sua senha.':'Use a câmera frontal do celular para tirar uma selfie.'}</div>`;actions.innerHTML=`<button class="btn primary" data-act="selfie">Tirar selfie</button>${senhaOk()&&mode==='punch'?'<button class="btn" data-act="use-pw">Registrar com senha</button>':''}`};
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false}).then(st=>{
      if(!CAP){st.getTracks().forEach(t=>t.stop());return}
      STREAM=st;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=st;$('#cam').innerHTML='';$('#cam').appendChild(v);CAP.video=v;
      actions.innerHTML=`<button class="btn primary" data-act="shoot">${IC.face.replace('<svg','<svg width="18" height="18"')}${enrolling?'Capturar referência':'Validar e registrar'}</button>`;

  }else fallback('Este navegador não oferece câmera ao vivo.');
}
function frameFromVideo(v){const c=document.createElement('canvas');const s=Math.min(v.videoWidth,v.videoHeight)||480;c.width=c.height=Math.min(s,480);const x=c.getContext('2d');x.translate(c.width,0);x.scale(-1,1);x.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,c.width,c.height);return c}
function frameFromImg(img){const c=document.createElement('canvas');const s=Math.min(img.naturalWidth,img.naturalHeight);c.width=c.height=Math.min(s,480);c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,c.width,c.height);return c}
function signature(c){
  const k=document.createElement('canvas');k.width=k.height=16;const x=k.getContext('2d');const s=c.width*.62;x.drawImage(c,(c.width-s)/2,(c.height-s)/2*.85,s,s,0,0,16,16);
  const d=x.getImageData(0,0,16,16).data,g=[];for(let i=0;i<d.length;i+=4)g.push(.299*d[i]+.587*d[i+1]+.114*d[i+2]);
  const m=g.reduce((a,b)=>a+b,0)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/g.length)||1;
  return{sig:g.map(v=>+((v-m)/sd).toFixed(3)),lum:m,contrast:sd};
}
function thumb(c,size){const k=document.createElement('canvas');k.width=k.height=size;k.getContext('2d').drawImage(c,0,0,size,size);return k.toDataURL('image/jpeg',.72)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function getGeo(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const t=setTimeout(()=>{if(!done){done=true;res(null)}},8000);try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy})},()=>{if(done)return;done=true;clearTimeout(t);res(null)},{enableHighAccuracy:true,timeout:7500,maximumAge:30000})}catch(e){done=true;clearTimeout(t);res(null)}})}

async function processCapture(canvas){
  const e=ME,enrolling=CAP.enrolling,mode=CAP.mode;
  stopCam();
  $('#cam').innerHTML=`<img class="snap" src="${canvas.toDataURL('image/jpeg',.8)}" alt="Captura">`;

  const stepsEl=$('#steps');stepsEl.hidden=false;
  const names=enrolling?['Detectando rosto','Verificando qualidade da imagem','Salvando referência biométrica']:['Detectando rosto','Verificando qualidade da imagem','Comparando com a referência','Registrando no servidor'];
  stepsEl.innerHTML=names.map((n,i)=>`<div class="step" id="st${i}"><i></i><span>${n}</span></div>`).join('');
  const setS=(i,st,txt)=>{const el=$('#st'+i);if(!el)return;el.className='step '+st;el.querySelector('i').textContent=st==='ok'?'✓':(st==='fail'?'!':'');if(txt)el.querySelector('span').textContent=txt};
  const fail=(i,msg)=>{setS(i,'fail');$('#ring').className='ring bad';$('#scan').hidden=true;$('#cap-msg').innerHTML=`<b style="color:#fff">${esc(msg)}</b>`;
    $('#cap-actions').innerHTML=`<button class="btn" data-act="retry">Tentar novamente</button>${mode==='punch'?(senhaOk()?'<button class="btn" data-act="use-pw">Registrar com senha</button>':(!enrolling?'<button class="btn ghost" data-act="nobio">Registrar sem biometria</button>':'')):''}`;CAP.lastCanvas=canvas};
  const sg=signature(canvas);
  setS(0,'run');await sleep(600);
  if('FaceDetector' in window){try{const fd=new window.FaceDetector({fastMode:true,maxDetectedFaces:2});const faces=await fd.detect(canvas);if(!faces.length)return fail(0,'Nenhum rosto encontrado. Aproxime o rosto da câmera.');if(faces.length>1)return fail(0,'Mais de um rosto na imagem. Registre sozinho.')}catch(err){}}
  setS(0,'ok');
  setS(1,'run');await sleep(500);
  if(sg.lum<45)return fail(1,'Imagem muito escura. Procure um local com mais luz.');
  if(sg.lum>235)return fail(1,'Imagem estourada pela luz. Afaste-se da claridade.');
  if(sg.contrast<14)return fail(1,'Imagem sem nitidez. Limpe a lente e tente de novo.');
  setS(1,'ok');
  if(enrolling){
    setS(2,'run');
    const th=thumb(canvas,120);
    const {error}=await sb.rpc('cadastrar_face',{p_sig:sg.sig,p_thumb:th});
    if(error)return fail(2,errMsg(error));
    ME.face={sig:sg.sig,thumb:th};ME.bio='pendente';const me=S.emps.find(x=>x.id===ME.id);if(me){me.face=ME.face;me.bio='pendente'}
    setS(2,'ok');$('#ring').className='ring ok';$('#scan').hidden=true;
    if(mode==='enroll'){$('#cap-msg').innerHTML='<b style="color:#fff">Referência enviada.</b><br>O RH vai validar sua foto.';$('#cap-actions').innerHTML='<button class="btn primary" data-act="close">Concluir</button>';return}
    $('#cap-msg').innerHTML='<b style="color:#fff">Referência cadastrada.</b> Registrando seu ponto…';
    stepsEl.insertAdjacentHTML('beforeend','<div class="step" id="st9"><i></i><span>Registrando no servidor</span></div>');
    return finalizePunch({metodo:'cadastro',score:1,foto:thumb(canvas,96)},9);
  }
  setS(2,'run');await sleep(600);
  let dot=0;for(let i=0;i<256;i++)dot+=sg.sig[i]*(e.face.sig[i]||0);const corr=dot/256;const score=Math.max(0,Math.min(1,(corr+1)/2));
  if(score<S.config.limiar)return fail(2,`Rosto não confere com a referência (${Math.round(score*100)}%). Tente de frente, com a mesma iluminação do cadastro.`);
  setS(2,'ok',`Similaridade ${Math.round(score*100)}%`);
  return finalizePunch({metodo:'facial',score:+score.toFixed(2),foto:thumb(canvas,96)},3);
}
async function finalizePunch(info,stepId){
  const el=()=>$('#st'+stepId);
  if(el()){el().className='step run'}
  const geo=await getGeo();
  const {data,error}=await sb.rpc('registrar_ponto',{p_metodo:info.metodo,p_score:info.score,p_lat:geo?geo.lat:null,p_lng:geo?geo.lng:null,p_acc:geo?geo.acc:null,p_foto:info.foto||null,p_obs:info.obs||null});
  if(error){if(el()){el().className='step fail';el().querySelector('i').textContent='!'}$('#ring').className='ring bad';$('#scan').hidden=true;$('#cap-msg').innerHTML=`<b style="color:#fff">${esc(errMsg(error))}</b>`;$('#cap-actions').innerHTML='<button class="btn" data-act="close">Fechar</button>';return}
  const p=mapPunch(data);S.punches.push(p);
  if(el()){el().className='step ok';el().querySelector('i').textContent='✓';el().querySelector('span').textContent=geo?(p.foraCerca?'Registrado fora da cerca virtual':'Registrado com localização'):'Registrado sem localização'}

  $('.modal').innerHTML=`<div class="modal-h"><div><div class="eyebrow" style="color:var(--ok)">Ponto registrado</div><h3>${esc(tipoN(marksOf(ME.id,p.ts.slice(0,10)).findIndex(x=>x.id===p.id)))}</h3></div><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">${receiptHTML(p)}${p.revisao==='pendente'?'<div class="notice">Esta marcação foi enviada para revisão do RH.</div>':''}${!geo?'<div class="notice">A localização não foi enviada. Permita o acesso à localização no navegador para os próximos registros.</div>':''}</div><div class="modal-f"><button class="btn primary" data-act="close">Concluir</button></div>`;
}

function saveFile(name,text){
  const blob=new Blob(['﻿'+text],{type:name.endsWith('.csv')?'text/csv':'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Arquivo gerado: '+name);
}
function csvMirror(eid,ym){const e=emp(eid),ms=monthSummary(e,ym),td=today();const L=[['Data','Dia','Entrada','Saída intervalo','Retorno','Saída','Trabalhado','Saldo','Situação'].join(';')];ms.days.filter(d=>d.ds<=td&&d.status!=='futuro').forEach(di=>{const m=di.marks.map(x=>x.ts.slice(11,16));L.push([fmtDate(di.ds),DOW[di.dow],m[0]||'',m[1]||'',m[2]||'',m[3]||'',dur(di.credit),saldoTxt(di.saldo),ST[di.status][0]].join(';'))});L.push(['Total','','','','','',dur(ms.worked),saldoTxt(ms.saldo),''].join(';'));saveFile(`espelho_${e.login.split('@')[0]}_${ym}.csv`,L.join('\n'))}
function csvReport(ym){const L=[['Login','Nome','Vínculo','Trabalhado','Previsto','Horas extras','Saldo','Atrasos','Faltas'].join(';')];S.emps.filter(e=>e.ativo).forEach(e=>{const m=monthSummary(e,ym);L.push([e.login,e.nome,e.vinculo||e.depto,dur(m.worked),dur(m.exp),dur(m.extra),saldoTxt(m.saldo),m.atrasos,m.faltas].join(';'))});saveFile(`fechamento_ponto_${ym}.csv`,L.join('\n'))}
function afd(ym){const cn=S.company.cnpj.replace(/\D/g,'');const L=[`000000000|1|1|${cn}|${S.company.razao}|${ym}|layout simplificado`];S.punches.filter(p=>p.ts.startsWith(ym)).sort((a,b)=>a.nsr-b.nsr).forEach(p=>{const e=emp(p.empId)||{};L.push([String(p.nsr).padStart(9,'0'),'7',p.ts,e.cpf||'',e.matricula||'',p.metodo,(p.hash||'').slice(0,16)].join('|'))});L.push(`999999999|${L.length-1} registros`);saveFile(`AFD_${cn}_${ym}.txt`,L.join('\n'))}

  if(error||!data||!data.ativo){await sb.auth.signOut();BOOT.msg=error?errMsg(error):'Seu acesso não está ativo. Fale com o RH.';MODE='login';return}

  await loadAll();
  safeStorage.setItem('batida.perfil',perfil);
  MODE=ME.trocarSenha?'senha':perfil;BOOT.msg='';

}

      await loadAll();closeModal();toast(`${n} espelho(s) aprovado(s)`);break}
    case 'setor-form':setorForm(t.dataset.id);break;
    case 'setor-del':{const s=S.setores.find(x=>x.id===t.dataset.id);openModal(`<div class="modal-h"><h3>Excluir setor</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b"><p>O setor <b>${esc(s.nome)}</b> será excluído. Os colaboradores dele ficam sem setor, e o ponto deles passa a ser aprovado pelo RH. As aprovações já feitas continuam guardadas.</p></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="setor-del-ok" data-id="${s.id}">Excluir</button></div>`);break}
    case 'setor-del-ok':{t.disabled=true;const {error}=await sb.from('setores').delete().eq('id',t.dataset.id);if(error)throw error;await loadAll();closeModal();toast('Setor excluído');break}
    case 'u-filter':UI.uf=t.dataset.v;render();break;
    case 'u-pass':passForm(t.dataset.id);break;
    case 'u-gen':{const i=$('#'+t.dataset.target);if(i)i.value=genPass();break}
    case 'u-copy':{try{await navigator.clipboard.writeText(CRED);toast('Dados copiados')}catch(e){toast('Selecione e copie os dados manualmente')}break}
    case 'u-role':{const e=emp(t.dataset.id);const novo=e.papel==='rh'?'colaborador':'rh';openModal(`<div class="modal-h"><h3>${novo==='rh'?'Tornar administrador':'Remover administrador'}</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b"><p>${novo==='rh'?`<b>${esc(e.nome)}</b> passará a ver todos os colaboradores, aprovar solicitações e cadastrar usuários.`:`<b>${esc(e.nome)}</b> deixará de acessar o painel do RH e passará a ver só o próprio ponto.`}</p></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="u-role-ok" data-id="${e.id}" data-v="${novo}">Confirmar</button></div>`);break}
    case 'u-role-ok':{t.disabled=true;const {error}=await sb.from('colaboradores').update({papel:t.dataset.v}).eq('id',t.dataset.id);if(error)throw error;await loadAll();closeModal();toast(t.dataset.v==='rh'?'Agora é administrador do RH':'Perfil alterado para colaborador');break}
    case 'u-block':{const e=emp(t.dataset.id);const ativo=t.dataset.v==='1';if(!ativo){openModal(`<div class="modal-h"><h3>Bloquear acesso</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b"><p><b>${esc(e.nome)}</b> não conseguirá mais entrar nem registrar ponto. As marcações já feitas continuam guardadas.</p></div><div class="modal-f"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn danger" data-act="u-block-ok" data-id="${e.id}" data-v="0">Bloquear</button></div>`);break}
      t.disabled=true;await invoke({acao:'acesso',colaborador_id:e.id,ativo:true});await loadAll();render();toast('Acesso desbloqueado');break}
    case 'u-block-ok':{t.disabled=true;await invoke({acao:'acesso',colaborador_id:t.dataset.id,ativo:false});await loadAll();closeModal();toast('Acesso bloqueado');break}
    case 'bulk-access':{const n=S.emps.filter(e=>e.ativo&&!e.temAcesso).length;openModal(`<form data-form="bulk"><div class="modal-h"><h3>Criar acessos</h3><button type="button" class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">
      <p>Cria o login de ${n} colaborador(es) ativo(s) que ainda não têm acesso. Cada um entra com o próprio <b>login</b> (nome.sobrenome) e esta senha inicial, e cria uma senha pessoal no primeiro acesso.</p>
      <div class="field"><label for="bk-s">Senha inicial (mínimo 6 caracteres)</label><input class="input" id="bk-s" name="senha" type="text" minlength="6" autocomplete="off" required></div>
      <div class="notice">Pode levar alguns segundos. Prestadores PJ também recebem acesso. Se não devem bater ponto, marque-os como desligados antes.</div>
      </div><div class="modal-f"><button type="button" class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" type="submit">Criar ${n} acesso(s)</button></div></form>`);break}
    case 'add-punch':addPunchForm(t.dataset.id);break;
    case 'req-dec':decideForm(t.dataset.id,t.dataset.v);break;
    case 'anexo':{const {data,error}=await sb.storage.from('anexos').createSignedUrl(t.dataset.path,300);if(error)throw error;window.open(data.signedUrl,'_blank','noopener');break}
    case 'pun-dec':{t.disabled=true;const {error}=await sb.rpc('revisar_marcacao',{p_id:t.dataset.id,p_status:t.dataset.v});if(error)throw error;await loadAll({punches:true});render();toast(t.dataset.v==='aceita'?'Marcação aceita':'Marcação desconsiderada e arquivada');break}
    case 'bio-dec':{t.disabled=true;const patch={bio_status:t.dataset.v};if(t.dataset.v==='rejeitada'){patch.face_sig=null;patch.face_thumb=null}const {error}=await sb.from('colaboradores').update(patch).eq('id',t.dataset.id);if(error)throw error;await loadAll();render();toast(t.dataset.v==='validada'?'Biometria validada':'Cadastro facial recusado');break}
    case 'clear-face':{const {error}=await sb.from('colaboradores').update({face_sig:null,face_thumb:null,bio_status:'nenhuma'}).eq('id',t.dataset.id);if(error)throw error;await loadAll();closeModal();toast('Referência facial apagada');break}
    case 'use-geo':{toast('Buscando sua localização…');const g=await getGeo();if(!g){toast('Não foi possível obter a localização. Permita o acesso no navegador.');break}$('#c-lat').value=g.lat.toFixed(6);$('#c-lng').value=g.lng.toFixed(6);$('#c-at').value='1';toast('Localização preenchida. Salve para aplicar.');break}
  }}catch(err){toast(errMsg(err));t.disabled=false}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='selfie'&&t.files&&t.files[0]){const img=new Image();img.onload=()=>processCapture(frameFromImg(img));img.onerror=()=>toast('Não foi possível ler a imagem');img.src=URL.createObjectURL(t.files[0]);return}
  const c=t.dataset.change;if(!c)return;
  if(c==='month'){UI.mirrorMonth=t.value;ensureMonth(t.value).then(render).catch(e=>toast(errMsg(e)))}
  if(c==='memp'){UI.mirrorEmp=t.value;render()}
  if(c==='reqtipo')reqForm(t.value);
  if(c==='team-month'){UI.teamMonth=t.value;ensureMonth(t.value).then(render).catch(e=>toast(errMsg(e)))}
});
document.addEventListener('input',ev=>{const t=ev.target;const k=t.dataset.input;if(k==='s-filter'){const q=t.value.toLowerCase();document.querySelectorAll('#s-list [data-filtro]').forEach(el=>{el.hidden=!!q&&!el.dataset.filtro.includes(q)});return}if(k==='sug-login'){const o=$('#'+t.dataset.target);if(o&&!o.dataset.manual)o.value=sugereLogin(t.value);return}if(t.id==='u-login'||t.id==='f-login'){t.dataset.manual='1';return}if(k==='q'||k==='uq'){UI[k]=t.value;const pos=t.selectionStart;render();const n=$('#'+k);if(n){n.focus();n.setSelectionRange(pos,pos)}}});
async function invoke(body){const {data,error}=await sb.functions.invoke('gerenciar-acesso',{body});if(error){let m=error.message;try{const j=await error.context.json();if(j&&j.erro)m=j.erro}catch(e){}throw new Error(m)}if(data&&data.erro)throw new Error(data.erro);return data}
document.addEventListener('submit',async ev=>{
  const f=ev.target;const k=f.dataset.form;if(!k)return;ev.preventDefault();
  const fd=Object.fromEntries(new FormData(f));const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;
  const showErr=m=>{const el=$('#l-err');if(el)el.textContent=m;else toast(m)};
  try{
  if(k==='login'){
    const login=fd.login.trim().toLowerCase();
    const email=login.includes('@')?login:`${login}@${LOGIN_DOM}`;
    const {error}=await sb.auth.signInWithPassword({email,password:fd.senha});
    if(error){showErr(error.message.includes('Invalid')?'Login ou senha incorretos.':errMsg(error));if(btn)btn.disabled=false;return}
    BOOT.loading=true;render();await afterLogin();BOOT.loading=false;render();return;
  }
  if(k==='bootstrap'){
    if(fd.senha!==fd.senha2){showErr('As senhas não conferem.');if(btn)btn.disabled=false;return}
    const login=fd.login.trim().toLowerCase();
    await invoke({acao:'bootstrap',nome:fd.nome.trim(),login,senha:fd.senha});
    const {error}=await sb.auth.signInWithPassword({email:login.includes('@')?login:`${login}@${LOGIN_DOM}`,password:fd.senha});if(error)throw error;
    BOOT.existeRH=true;BOOT.loading=true;render();await afterLogin();BOOT.loading=false;render();toast('Acesso do RH criado');return;
  }
  if(k==='punch-pw'){
    const errEl=$('#pw-err');errEl.textContent='';if(btn)btn.textContent='Registrando…';
    const geo=await getGeo();
    const {data,error}=await sb.rpc('registrar_ponto_senha',{p_senha:fd.senha,p_lat:geo?geo.lat:null,p_lng:geo?geo.lng:null,p_acc:geo?geo.acc:null});
    if(error||!data||!data.ok){errEl.textContent=error?errMsg(error):(data&&data.erro)||'Não foi possível registrar.';const i=$('#pw-s');if(i){i.value='';i.focus()}if(btn){btn.disabled=false;btn.textContent='Registrar ponto'}return}
    const p=mapPunch(data.marcacao);S.punches.push(p);
    $('.modal').innerHTML=`<div class="modal-h"><div><div class="eyebrow" style="color:var(--ok)">Ponto registrado</div><h3>${esc(tipoN(marksOf(ME.id,p.ts.slice(0,10)).findIndex(x=>x.id===p.id)))}</h3></div><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">${receiptHTML(p)}${p.revisao==='pendente'?'<div class="notice">Esta marcação foi enviada para revisão do RH.</div>':''}${!geo?'<div class="notice">A localização não foi enviada. Permita o acesso à localização no navegador para os próximos registros.</div>':''}</div><div class="modal-f"><button class="btn primary" data-act="close">Concluir</button></div>`;
    return;
  }
  if(k==='nova-senha'){
    if(fd.senha!==fd.senha2){showErr('As senhas não conferem.');if(btn)btn.disabled=false;return}
    const {error}=await sb.auth.updateUser({password:fd.senha});if(error)throw error;
    const r2=await sb.rpc('senha_trocada');if(r2.error)throw r2.error;
    ME.trocarSenha=false;MODE=UI.loginRole==='rh'&&ME.papel==='rh'?'rh':'emp';render();toast('Senha criada');return;
  }
  if(k==='ap'){
    const e=emp(f.dataset.id),ym=f.dataset.ym,ms=monthSummary(e,ym);
    const {error}=await sb.rpc('aprovar_ponto',{p_colab:e.id,p_comp:ym,p_status:f.dataset.v,p_obs:fd.obs.trim()||null,p_resumo:{trabalhado:ms.worked,previsto:ms.exp,saldo:ms.saldo,extras:ms.extra,atrasos:ms.atrasos,faltas:ms.faltas}});
    if(error)throw error;if(UI.sigReq)delete UI.sigReq[e.id+'|'+ym];if(UI.sig)delete UI.sig[e.id+'|'+ym];
    await loadAll();closeModal();toast(f.dataset.v==='aprovado'?'Ponto aprovado':'Ponto devolvido para ajuste');return;
  }
  if(k==='setor'){
    const id=f.dataset.id||null;const nome=fd.nome.trim();
    if(S.setores.some(s=>s.id!==id&&s.nome.toLowerCase()===nome.toLowerCase()))throw new Error('Já existe um setor com esse nome.');
    const row={nome,gestor_id:fd.gestor||null};
    let sid=id;
    if(id){const {error}=await sb.from('setores').update(row).eq('id',id);if(error)throw error}
    else{const {data,error}=await sb.from('setores').insert(row).select('id').single();if(error)throw error;sid=data.id}
    const marcados=S.emps.filter(e=>fd['m_'+e.id]).map(e=>e.id);
    const sair=S.emps.filter(e=>e.setorId===sid&&!marcados.includes(e.id)).map(e=>e.id);
    if(marcados.length){const {error}=await sb.from('colaboradores').update({setor_id:sid}).in('id',marcados);if(error)throw error}
    if(sair.length){const {error}=await sb.from('colaboradores').update({setor_id:null}).in('id',sair);if(error)throw error}
    await loadAll();closeModal();toast('Setor salvo');return;
  }
  if(k==='u-new'){
    const errEl=$('#u-err');
    const login=fd.login.trim().toLowerCase();
    if(!loginOk(login)){errEl.textContent='Login inválido. Use letras minúsculas, números, ponto, hífen ou sublinhado (3 a 40 caracteres), sem espaços nem acentos.';if(btn)btn.disabled=false;return}
    if(S.emps.some(x=>x.login.toLowerCase()===login)){errEl.textContent='Esse login já está em uso.';if(btn)btn.disabled=false;return}
    const dados={nome:fd.nome.trim(),login,cargo:fd.cargo.trim(),vinculo:fd.vinculo.trim(),depto:'',email:fd.email.trim().toLowerCase(),cpf:fd.cpf.trim(),admissao:fd.admissao||null,jornada_id:fd.jornadaId,papel:fd.papel};
    await invoke({acao:'criar',senha:fd.senha,dados});
    await loadAll();closeModal();credModal(dados.nome,login,fd.senha);return;
  }
  if(k==='u-pass'){
    const e=emp(f.dataset.id);const tinha=e.temAcesso;
    await invoke({acao:'senha',colaborador_id:e.id,senha:fd.senha});
    await loadAll();closeModal();credModal(e.nome,e.login,fd.senha);toast(tinha?'Senha redefinida':'Acesso criado');return;
  }
  if(k==='bulk'){
    const r=await invoke({acao:'criar-acessos',senha:fd.senha});await loadAll();closeModal();
    toast(`${r.criados} acesso(s) criado(s)${r.falhas&&r.falhas.length?`, ${r.falhas.length} com erro`:''}`);
    if(r.falhas&&r.falhas.length)openModal(`<div class="modal-h"><h3>Acessos com erro</h3><button class="x" data-act="close" aria-label="Fechar">×</button></div><div class="modal-b">${r.falhas.map(x=>`<div class="notice">${esc(x)}</div>`).join('')}</div>`);
    return;
  }
  if(k==='req'){
    const file=f.querySelector('[name=anexo]');let path=null,nome=null;
    if(file&&file.files[0]){const fl=file.files[0];if(fl.size>10485760)throw new Error('O anexo passa de 10 MB.');nome=fl.name;path=`${ME.id}/${Date.now()}-${fl.name.replace(/[^\w.\-]+/g,'_')}`;const up=await sb.storage.from('anexos').upload(path,fl,{contentType:fl.type||'application/octet-stream'});if(up.error)throw up.error}
    const {error}=await sb.from('solicitacoes').insert({colaborador_id:ME.id,tipo:fd.tipo,data:fd.data,ate:fd.ate||null,hora:fd.hora||null,motivo:fd.motivo.trim(),anexo_path:path,anexo_nome:nome});
    if(error)throw error;await loadAll();closeModal();UI.empTab='solic';render();toast('Solicitação enviada ao RH');return;
  }
  if(k==='emp'){
    const id=f.dataset.id;
    const login=fd.login.trim().toLowerCase();
    if(!loginOk(login))throw new Error('Login inválido. Use letras minúsculas, números, ponto, hífen ou sublinhado (3 a 40 caracteres), sem espaços nem acentos.');
    if(S.emps.some(x=>x.id!==id&&x.login.toLowerCase()===login))throw new Error('Esse login já está em uso.');
    const dados={nome:fd.nome.trim(),cargo:fd.cargo.trim(),vinculo:fd.vinculo.trim(),depto:fd.depto.trim(),email:fd.email.trim().toLowerCase(),cpf:fd.cpf.trim(),admissao:fd.admissao||null,jornada_id:fd.jornadaId,papel:fd.papel};
    if(!id){
      await invoke({acao:'criar',senha:fd.senha,dados:Object.assign({login},dados)});
      await loadAll();closeModal();credModal(dados.nome,login,fd.senha);return;
    }
    const old=emp(id);
    if(id===ME.id&&dados.papel!=='rh')throw new Error('Você não pode remover o seu próprio perfil de RH.');
    const {error}=await sb.from('colaboradores').update(dados).eq('id',id);if(error)throw error;
    if(login!==old.login.toLowerCase())await invoke({acao:'login',colaborador_id:id,login});
    const ativo=fd.ativo==='1';if(ativo!==old.ativo)await invoke({acao:'acesso',colaborador_id:id,ativo});
    if(fd.senha)await invoke({acao:'senha',colaborador_id:id,senha:fd.senha});
    await loadAll();closeModal();
    if(fd.senha)credModal(dados.nome,login,fd.senha);else toast(login!==old.login.toLowerCase()?`Cadastro atualizado. Novo login: ${login}`:'Cadastro atualizado');
    return;
  }
  if(k==='jor'){
    const id=f.dataset.id;const dias=DOW.map((_,i)=>fd['d'+i]?i:-1).filter(i=>i>=0);
    if(!dias.length)throw new Error('Marque pelo menos um dia de trabalho.');
    const row={nome:fd.nome.trim(),ini:fd.ini,int_ini:fd.intIni,int_fim:fd.intFim,fim:fd.fim,tol:Math.min(10,Math.max(0,+fd.tol||0)),dias};
    const {error}=id?await sb.from('jornadas').update(row).eq('id',id):await sb.from('jornadas').insert(row);if(error)throw error;
    await loadAll();closeModal();toast('Jornada salva');return;
  }
  if(k==='addp'){const {error}=await sb.rpc('incluir_marcacao',{p_colab:f.dataset.id,p_ts:brIso(fd.data,fd.hora),p_obs:fd.obs});if(error)throw error;await loadAll({punches:true});closeModal();toast('Marcação incluída');return}
  if(k==='dec'){const {error}=await sb.rpc('decidir_solicitacao',{p_id:f.dataset.id,p_status:f.dataset.v,p_resposta:fd.resposta||(f.dataset.v==='aprovado'?'Aprovado.':'')});if(error)throw error;await loadAll({punches:true});closeModal();toast(f.dataset.v==='aprovado'?'Solicitação aprovada':'Solicitação recusada');return}
  if(k==='cfg'){
    const lat=fd.lat===''?null:+fd.lat,lng=fd.lng===''?null:+fd.lng;
    if(fd.ativa==='1'&&(lat==null||lng==null||isNaN(lat)||isNaN(lng)))throw new Error('Para ativar a cerca virtual, informe latitude e longitude.');
    const {error}=await sb.from('empresa').update({razao:fd.razao.trim(),cnpj:fd.cnpj.trim(),local:fd.local.trim(),cerca_ativa:fd.ativa==='1',cerca_lat:lat,cerca_lng:lng,cerca_raio:Math.max(30,+fd.raio||200),cerca_bloquear:fd.bloquear==='1',limiar:Math.min(.95,Math.max(.5,+fd.limiar||.78)),revisar_sem_bio:fd.exigir==='1',modo_senha:fd.facial==='0'&&fd.modoSenha==='bloqueada'?'permitida':fd.modoSenha,facial_ativo:fd.facial==='1',atualizado_em:new Date().toISOString()}).eq('id',1);
    if(error)throw error;await loadAll();render();toast('Configurações salvas');return;
  }
  }catch(err){showErr(errMsg(err));if(btn)btn.disabled=false}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#modal-root').innerHTML)closeModal()});

if(!window.supabase){document.getElementById('app').innerHTML='<div class="empty">Não foi possível carregar a conexão com o servidor. Verifique a internet e recarregue a página.</div>'}else boot();
})();
</script>
